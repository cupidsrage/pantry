<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pantry &amp; List</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; background: #fafaf9; color: #292524; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; letter-spacing: -.02em; }
  .sub { font-size: 14px; color: #78716c; margin: 2px 0 20px; }
  .tabs { display: flex; gap: 4px; background: rgba(214,211,209,.4); padding: 4px; border-radius: 12px; margin-bottom: 20px; }
  .tab { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; font-size: 14px; font-weight: 500; color: #78716c; cursor: pointer; }
  .tab.active { background: #fff; color: #1c1917; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  textarea { width: 100%; height: 176px; padding: 12px; border: 1px solid #d6d3d1; border-radius: 12px; font-size: 14px; resize: none; font-family: inherit; }
  textarea:focus, input:focus { outline: 2px solid #34d399; }
  .btn { border: 0; border-radius: 12px; padding: 10px; font-size: 14px; font-weight: 500; color: #fff; cursor: pointer; width: 100%; }
  .btn-green { background: #059669; } .btn-green:hover { background: #047857; }
  .btn-dark { background: #44403c; } .btn-dark:hover { background: #292524; }
  .btn-sky { background: #0284c7; } .btn-sky:hover { background: #0369a1; }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid #e7e5e4; background: #fff; border-radius: 12px; margin-bottom: 8px; }
  .row.checked { border-color: #a7f3d0; background: #ecfdf5; }
  .name { flex: 1; font-size: 14px; text-transform: capitalize; }
  .name.done { text-decoration: line-through; color: #a8a29e; }
  .qty { font-size: 12px; color: #57534e; min-width: 56px; text-align: center; }
  .ic { border: 0; background: none; cursor: pointer; color: #a8a29e; padding: 4px; font-size: 15px; line-height: 1; }
  .ic:hover { color: #44403c; }
  .ic.del:hover { color: #ef4444; } .ic.link { color: #0284c7; }
  .check { width: 24px; height: 24px; border: 1px solid #d6d3d1; border-radius: 6px; background: none; cursor: pointer; color: #fff; }
  .check.on { background: #059669; border-color: #059669; }
  .empty { text-align: center; color: #a8a29e; font-size: 14px; padding: 40px 0; }
  .parsed { border: 1px solid #e7e5e4; border-radius: 12px; overflow: hidden; margin-top: 16px; }
  .parsed-head { padding: 8px 12px; background: #f5f5f4; font-size: 12px; font-weight: 600; color: #78716c; text-transform: uppercase; }
  .pitem { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-top: 1px solid #f5f5f4; font-size: 14px; }
  .stock { font-size: 12px; color: #059669; font-weight: 500; }
  .addbar { display: flex; gap: 8px; margin-bottom: 12px; }
  .addbar input { padding: 8px 12px; border: 1px solid #d6d3d1; border-radius: 8px; font-size: 14px; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .err { color: #dc2626; font-size: 14px; margin-top: 8px; }
  .mt { margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pantry &amp; List</h1>
  <p class="sub">Paste a recipe, build your list, track what's in stock.</p>
  <div class="tabs">
    <button class="tab active" data-tab="recipe">Recipe</button>
    <button class="tab" data-tab="list">List</button>
    <button class="tab" data-tab="pantry">Pantry</button>
  </div>
  <div id="view"></div>
</div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const api = (p, opt) => fetch("/api" + p, opt).then(r => r.json());
const norm = s => s.toLowerCase().trim().replace(/s$/, "");
const fmt = (q, u) => `${q}${u ? " " + u : ""}`;
const wm = n => `https://www.walmart.com/search?q=${encodeURIComponent(n)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let tab = "recipe", pantry = [], list = [], parsed = null, rawRecipe = "", parsing = false, err = "";

async function refresh() {
  [pantry, list] = await Promise.all([api("/pantry"), api("/list")]);
  render();
}

document.querySelectorAll(".tab").forEach(b =>
  b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === b));
    render();
  });

function render() {
  const v = $("#view");
  if (tab === "recipe") v.innerHTML = recipeView();
  else if (tab === "list") v.innerHTML = listView();
  else v.innerHTML = pantryView();
  wire();
}

// ---------- Recipe ----------
function recipeView() {
  let html = `
    <textarea id="raw" placeholder="Paste a full recipe or just its ingredient list here…">${esc(rawRecipe)}</textarea>
    <button class="btn btn-green mt" id="extract" ${parsing ? "disabled" : ""}>
      ${parsing ? "Reading recipe…" : "Extract ingredients"}</button>
    ${err ? `<p class="err">${esc(err)}</p>` : ""}`;
  if (parsed) {
    html += `<div class="parsed"><div class="parsed-head">Found ${parsed.length} ingredient${parsed.length !== 1 ? "s" : ""} — uncheck any to skip</div>`;
    parsed.forEach((p, i) => {
      const have = pantry.find(x => norm(x.name) === norm(p.name));
      html += `<label class="pitem">
        <input type="checkbox" data-use="${i}" ${p.use ? "checked" : ""} style="accent-color:#059669;width:16px;height:16px" />
        <span class="name" style="flex:1">${esc(p.name)}</span>
        <span class="qty">${esc(fmt(p.qty, p.unit))}</span>
        ${have ? `<span class="stock">in stock: ${esc(fmt(have.qty, have.unit))}</span>` : ""}
      </label>`;
    });
    html += `<div class="actions" style="padding:12px;background:#fafaf9;border-top:1px solid #f5f5f4">
      <button class="btn btn-green" id="toList">Add needed → List</button>
      <button class="btn btn-dark" id="cook">Cooked it → subtract stock</button>
    </div></div>`;
  }
  return html;
}

// ---------- List ----------
function listView() {
  if (!list.length) return `<p class="empty">Nothing on the list yet. Add a recipe's ingredients from the Recipe tab.</p>`;
  let html = list.map(it => `
    <div class="row ${it.checked ? "checked" : ""}">
      <button class="check ${it.checked ? "on" : ""}" data-check="${it.id}">${it.checked ? "✓" : ""}</button>
      <span class="name ${it.checked ? "done" : ""}">${esc(it.name)}</span>
      <button class="ic" data-lqty="${it.id}" data-d="-1">−</button>
      <span class="qty">${esc(fmt(it.qty, it.unit))}</span>
      <button class="ic" data-lqty="${it.id}" data-d="1">+</button>
      <a class="ic link" href="${wm(it.name)}" target="_blank" rel="noreferrer" title="Find on Walmart">↗</a>
      <button class="ic del" data-ldel="${it.id}">🗑</button>
    </div>`).join("");
  const unchecked = list.filter(x => !x.checked).map(x => x.name).join(" ");
  html += `<div class="actions">
    <button class="btn btn-green" id="purchase" ${list.some(x => x.checked) ? "" : "disabled"}>Mark checked as purchased → Pantry</button>
    <a class="btn btn-sky" style="width:auto;padding:10px 16px;text-decoration:none;display:flex;align-items:center;justify-content:center"
       href="${wm(unchecked)}" target="_blank" rel="noreferrer">🛒 Walmart</a>
  </div>`;
  return html;
}

// ---------- Pantry ----------
function pantryView() {
  let html = `<div class="addbar">
    <input id="pname" placeholder="Item" style="flex:1" />
    <input id="pqty" placeholder="Qty" type="number" style="width:64px" />
    <input id="punit" placeholder="Unit" style="width:80px" />
    <button class="btn btn-dark" id="padd" style="width:auto;padding:0 14px">+</button>
  </div>`;
  if (!pantry.length) html += `<p class="empty">Pantry is empty. Purchased items land here automatically.</p>`;
  else html += pantry.map(it => `
    <div class="row">
      <span class="name">${esc(it.name)}</span>
      <button class="ic" data-pqty="${it.id}" data-d="-1">−</button>
      <span class="qty">${esc(fmt(it.qty, it.unit))}</span>
      <button class="ic" data-pqty="${it.id}" data-d="1">+</button>
      <button class="ic del" data-pdel="${it.id}">🗑</button>
    </div>`).join("");
  return html;
}

// ---------- events ----------
function wire() {
  const raw = $("#raw"); if (raw) raw.oninput = e => rawRecipe = e.target.value;
  const ex = $("#extract"); if (ex) ex.onclick = extract;
  document.querySelectorAll("[data-use]").forEach(c => c.onchange = () => parsed[+c.dataset.use].use = c.checked);
  const tl = $("#toList"); if (tl) tl.onclick = addToList;
  const ck = $("#cook"); if (ck) ck.onclick = cook;

  document.querySelectorAll("[data-check]").forEach(b => b.onclick = async () => {
    const it = list.find(x => x.id == b.dataset.check);
    await api(`/list/${it.id}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ checked: !it.checked }) });
    refresh();
  });
  document.querySelectorAll("[data-lqty]").forEach(b => b.onclick = async () => {
    const it = list.find(x => x.id == b.dataset.lqty);
    const q = Math.max(0, +(it.qty + (+b.dataset.d)).toFixed(2));
    await api(`/list/${it.id}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ qty: q }) });
    refresh();
  });
  document.querySelectorAll("[data-ldel]").forEach(b => b.onclick = async () => { await api(`/list/${b.dataset.ldel}`, { method: "DELETE" }); refresh(); });
  const pu = $("#purchase"); if (pu) pu.onclick = async () => { await api("/purchase", { method: "POST" }); refresh(); };

  const pa = $("#padd"); if (pa) pa.onclick = addPantry;
  document.querySelectorAll("[data-pqty]").forEach(b => b.onclick = async () => {
    const it = pantry.find(x => x.id == b.dataset.pqty);
    const q = Math.max(0, +(it.qty + (+b.dataset.d)).toFixed(2));
    await api(`/pantry/${it.id}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ qty: q }) });
    refresh();
  });
  document.querySelectorAll("[data-pdel]").forEach(b => b.onclick = async () => { await api(`/pantry/${b.dataset.pdel}`, { method: "DELETE" }); refresh(); });
}

async function extract() {
  if (!rawRecipe.trim()) return;
  parsing = true; err = ""; parsed = null; render();
  try {
    const r = await api("/parse", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ recipe: rawRecipe }) });
    if (r.error) throw new Error(r.error);
    parsed = r.items.map(x => ({ ...x, use: true }));
  } catch (e) {
    err = "Couldn't read that recipe. Try pasting the ingredient list more cleanly.";
  } finally {
    parsing = false; render();
  }
}

async function addToList() {
  const chosen = parsed.filter(p => p.use);
  for (const p of chosen) {
    const have = pantry.find(x => norm(x.name) === norm(p.name));
    const need = have ? Math.max(0, p.qty - have.qty) : p.qty;
    if (need <= 0 && have) continue;
    const existing = list.find(x => norm(x.name) === norm(p.name));
    if (existing) await api(`/list/${existing.id}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ qty: +(existing.qty + (need || p.qty)).toFixed(2) }) });
    else await api("/list", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: p.name, qty: need || p.qty, unit: p.unit }) });
  }
  parsed = null; rawRecipe = ""; tab = "list";
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === "list"));
  refresh();
}

async function cook() {
  const items = parsed.filter(p => p.use).map(p => ({ name: p.name, qty: p.qty }));
  await api("/cook", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ items }) });
  parsed = null; rawRecipe = ""; refresh();
}

async function addPantry() {
  const name = $("#pname").value, qty = +$("#pqty").value || 1, unit = $("#punit").value;
  if (!name.trim()) return;
  const existing = pantry.find(x => norm(x.name) === norm(name));
  if (existing) await api(`/pantry/${existing.id}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ qty: +(existing.qty + qty).toFixed(2) }) });
  else await api("/pantry", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, qty, unit }) });
  refresh();
}

refresh();
</script>
</body>
</html>
