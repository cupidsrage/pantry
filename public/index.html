<body>
<div class="wrap">

    </div>

      <button class="tab" data-tab="plan">Plan</button>
    </div>
    <div id="view"></div>

</div>

<script type="module">
// Logic the server runs too — one copy, imported by both, so the "can make"
// badge and the stock math can't drift apart. See lib/units.js.
import { UNITS, unitByKey, showBase, pkgsFromBase, norm } from "/lib/units.js";
import { STORAGE_STATES } from "/lib/expiry.js";
import { groupBatches } from "/lib/pantry.js";
import { recipeCoverage as coverageOf, recipeSoonestExpiry as soonestExpiryOf, recipeMatch } from "/lib/recipes.js";

const $ = (s, el=document) => el.querySelector(s);
const api = (p, opt) => fetch("/api" + p, opt).then(r => r.json());
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wm = n => `https://www.walmart.com/search?q=${encodeURIComponent(n)}`;
const J = o => ({ method: o.m, headers: { "content-type": "application/json" }, body: JSON.stringify(o.b) });

// Thin wrappers that bind the shared helpers to this page's live state.
const groupedPantry = () => groupBatches(pantry);
const recipeCoverage = (r) => coverageOf(r, pantry);
const recipeSoonestExpiry = (r) => soonestExpiryOf(r, pantry);

// Units you can type an amount in when removing part of a pantry item: every
// unit that converts to the item's base unit, plus the item's own package size.
function useUnitsFor(g) {
  const opts = UNITS.filter(u => u.base === g.base_unit)
    .map(u => ({ key: u.key, label: u.label, factor: u.factor }));
  if (g.pkg_base > 0 && Math.abs(g.pkg_base - 1) > 0.01)
    opts.unshift({ key: "__pkg", label: `${g.pkg_label || "package"} (whole package)`, factor: g.pkg_base });
  return opts;
}
// amount * factor = base units, for the unit currently picked in the editor
function useFactor(g, unitKey) {
  const u = useUnitsFor(g).find(x => x.key === unitKey);
  return u ? u.factor : 1;
}
// Base-unit amount the editor would remove, or 0 if the box is empty/invalid.
function useBaseAmount(g, u) {
  const amt = +u.amt;
  if (!(amt > 0)) return 0;
  return +(amt * useFactor(g, u.unit)).toFixed(2);
}
function pantryUseHint(g, u) {
  const have = `In stock: ${showBase(g.base, g.base_unit)}`;
  const useBase = useBaseAmount(g, u);
  if (!useBase) return have;
  if (useBase > g.base + 0.01) return `${have} — that's more than you have`;
  return `${have} → ${showBase(+(g.base - useBase).toFixed(2), g.base_unit)} left`;
}

// ---------- meal plan ----------
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function weekStartOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - x.getDay()); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtTime(hhmm) { // "18:00" -> "6:00 PM"
  if (!hhmm) return "";
  const [h, m] = hhmm.split(":").map(Number);
  const ap = h < 12 ? "AM" : "PM"; const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, "0")} ${ap}`;
}
function minutesToText(min) {
  if (min <= 0) return "";
  const h = Math.floor(min / 60), m = min % 60;
  return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
}
// Given a meal (with recipe + date + meal_time) return cooking/thaw reminders.
function mealReminders(m) {
  const out = { start: null, thaw: [] };
  const r = m.recipe;
  if (!r) return out;
  const total = (r.prep_min || 0) + (r.cook_min || 0);

  // Build the actual "eat" datetime from the planned date + time.
  let eatAt = null;
  if (m.date && m.meal_time) {
    const [y, mo, d] = m.date.split("-").map(Number);
    const [h, mn] = m.meal_time.split(":").map(Number);
    eatAt = new Date(y, mo - 1, d, h, mn, 0, 0);
  }

  let cookStartAt = null;
  if (eatAt && total > 0) {
    cookStartAt = new Date(eatAt.getTime() - total * 60000);
    out.start = fmtTime(`${String(cookStartAt.getHours()).padStart(2, "0")}:${String(cookStartAt.getMinutes()).padStart(2, "0")}`);
    out.startMins = total;
  }

  // Thaw: any ingredient we have ONLY as frozen stock. Tell the user WHEN to pull
  // it out so it's thawed by the time cooking starts (or by mealtime if no cook time).
  const deadline = cookStartAt || eatAt;
  for (const ing of (r.ingredients || [])) {
    const batches = pantry.filter(x => norm(x.name) === norm(ing.name));
    if (!batches.length) continue;
    const stateOf = (b) => b.storage || (b.shelf_life && b.shelf_life.where) || "";
    const allFrozen = batches.every(b => stateOf(b) === "freezer");
    if (!allFrozen) continue; // have some non-frozen stock; no need to thaw more
    // find a thaw_hours estimate from any batch that carries shelf_life
    const th = batches.map(b => b.shelf_life && b.shelf_life.thaw_hours).find(v => typeof v === "number" && v > 0);
    let when = "";
    if (deadline && th) {
      const thawBy = new Date(deadline.getTime() - th * 3600000);
      when = ` by ${thawWhenText(thawBy)}`;
    } else if (th) {
      when = ` (needs ~${th >= 24 ? Math.round(th / 24) + "d" : th + "h"})`;
    }
    out.thaw.push(esc(ing.name) + when);
  }
  return out;
}

// ---------- push reminders ----------
// The Plan tab already works out when to start cooking and when to thaw; this
// is what makes those arrive on your phone instead of waiting to be looked at.
let push = { enabled: false, subscribed: false, busy: false, error: "" };

const pushSupported = () =>
  "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

function b64ToBytes(b64) {
  const padded = (b64 + "=".repeat((4 - b64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(padded), c => c.charCodeAt(0));
}

async function currentSubscription() {
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}

// Reconcile browser state with the server on every start. Re-sending the
// subscription refreshes its stored timezone offset, so reminder times stay
// right across DST and travel.
async function initPush() {
  if (!pushSupported()) return;
  try {
    const r = await api("/push/key");
    push.enabled = !!r.enabled;
    if (!push.enabled) return;
    const sub = await currentSubscription();
    push.subscribed = !!(sub && Notification.permission === "granted");
    if (push.subscribed)
      await api("/push/subscribe", J({ m: "POST", b: { endpoint: sub.endpoint, tz_offset: new Date().getTimezoneOffset() } }));
  } catch { /* reminders are optional; never block startup on them */ }
}

async function enablePush() {
  push.busy = true; push.error = ""; render();
  try {
    const { key, enabled } = await api("/push/key");
    if (!enabled) throw new Error("Reminders aren't configured on the server yet.");
    if (await Notification.requestPermission() !== "granted")
      throw new Error("Notifications are blocked for this site — allow them in your browser settings, then try again.");
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
    const r = await api("/push/subscribe", J({ m: "POST", b: { endpoint: sub.endpoint, tz_offset: new Date().getTimezoneOffset() } }));
    if (r.error) throw new Error(r.error);
    push.subscribed = true;
  } catch (e) {
    push.error = e && e.message ? e.message : "Couldn't turn reminders on.";
  } finally {
    push.busy = false; render();
  }
}

async function disablePush() {
  push.busy = true; push.error = ""; render();
  try {
    const sub = await currentSubscription();
    if (sub) {
      await api("/push/unsubscribe", J({ m: "POST", b: { endpoint: sub.endpoint } }));
      await sub.unsubscribe();
    }
    push.subscribed = false;
  } catch (e) {
    push.error = e && e.message ? e.message : "Couldn't turn reminders off.";
  } finally {
    push.busy = false; render();
  }
}

// ---------- weekly planner ----------
// null when closed. Constraint edits update this object without re-rendering,
// so typing in the form doesn't drop the caret; only button presses re-render.
let planner = null;

const emptyPlanner = () => ({
  busy: false, error: "", proposal: null, addToList: true,
  constraints: { budget: "", maxWeeknightMin: "", vegetarianNights: "", skipDays: "", notes: "" },
});

async function generatePlan() {
  planner.busy = true; planner.error = ""; render();
  try {
    const r = await api("/plan/generate", J({ m: "POST", b: {
      weekStart: ymd(planWeekStart), constraints: planner.constraints,
    }}));
    if (r.error) throw new Error(r.error);
    planner.proposal = r;
  } catch (e) {
    planner.error = e && e.message ? e.message : "Couldn't build a plan.";
  } finally {
    planner.busy = false; render();
  }
}

async function applyPlan() {
  planner.busy = true; planner.error = ""; render();
  try {
    const p = planner.proposal;
    const r = await api("/plan/apply", J({ m: "POST", b: {
      weekStart: p.weekStart, meals: p.meals, replace: true, addToList: planner.addToList,
    }}));
    if (r.error) throw new Error(r.error);
    planner = null;
    await loadMeals();
  } catch (e) {
    planner.error = e && e.message ? e.message : "Couldn't save the plan.";
    planner.busy = false; render();
  }
}

function plannerForm() {
  const c = planner.constraints;
  const field = (key, label, ph, wide) => `
    <label style="flex:${wide ? "1 1 100%" : "1 1 44%"};min-width:0">
      <span class="meta" style="display:block;margin-bottom:3px">${label}</span>
      <input data-pc="${key}" value="${esc(c[key])}" placeholder="${ph}" ${wide ? "" : 'inputmode="numeric"'}
        style="width:100%;padding:7px 9px;border:1px solid #d6d3d1;border-radius:8px;font-size:14px" />
    </label>`;
  return `
    <div style="padding:12px">
      <p class="meta" style="margin-bottom:10px">Leave anything blank to let the planner decide.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${field("budget", "Budget ($)", "120")}
        ${field("maxWeeknightMin", "Weeknight max (min)", "45")}
        ${field("vegetarianNights", "Vegetarian nights", "2")}
        ${field("skipDays", "Nights off", "1")}
        ${field("notes", "Anything else", "no fish, kids eat early Wed", true)}
      </div>
      <button class="btn btn-green" id="planGo" ${planner.busy ? "disabled" : ""} style="margin-top:12px">
        ${planner.busy ? "Thinking…" : "Build the week"}</button>
      ${planner.error ? `<p class="err">${esc(planner.error)}</p>` : ""}
    </div>`;
}

function plannerReview() {
  const p = planner.proposal;
  const s = p.summary;
  const dayRow = (m) => {
    const d = new Date(m.date + "T00:00:00");
    return `<div style="display:flex;gap:10px;padding:7px 0;border-top:1px solid #f5f5f4">
      <span style="flex:none;width:46px;font-weight:600;font-size:13px">${DOW[d.getDay()]} ${d.getDate()}</span>
      <span style="flex:1;min-width:0">
        <span style="font-size:13px;font-weight:500;text-transform:capitalize">${esc(m.title)}</span>
        ${m.why ? `<br><span class="meta" style="font-size:11px">${esc(m.why)}</span>` : ""}
      </span>
      <span class="meta" style="flex:none;font-size:11px">${fmtTime(m.meal_time)}</span>
    </div>`;
  };
  const stat = (val, label) =>
    `<div style="flex:1;text-align:center"><div style="font-size:16px;font-weight:700">${val}</div>
     <div class="meta" style="font-size:10px">${label}</div></div>`;

  return `
    <div style="padding:12px">
      ${p.note ? `<p class="meta" style="margin-bottom:8px">${esc(p.note)}</p>` : ""}
      <div style="display:flex;gap:6px;padding:8px 0;background:#fafaf9;border-radius:8px;margin-bottom:6px">
        ${stat(s.meals, "meals")}
        ${stat(minutesToText(s.minutes) || "—", "cooking")}
        ${stat(s.caloriesPerDay == null ? "—" : s.caloriesPerDay, "kcal/day")}
        ${stat(p.cost.total > 0 ? "$" + p.cost.total.toFixed(0) : "—", "to buy")}
      </div>
      ${p.meals.map(dayRow).join("")}
      ${p.empty.length ? `<p class="meta" style="margin-top:8px">Left open: ${p.empty.map(d => DOW[new Date(d + "T00:00:00").getDay()]).join(", ")}</p>` : ""}
      ${p.dropped.length ? `<p class="meta" style="margin-top:6px;color:#d97706">Skipped ${p.dropped.length} suggestion${p.dropped.length > 1 ? "s" : ""} that didn't check out.</p>` : ""}

      <div style="margin-top:12px;padding-top:10px;border-top:1px solid #f5f5f4">
        <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
          <input type="checkbox" id="planAddList" ${planner.addToList ? "checked" : ""}
            style="accent-color:#059669;width:16px;height:16px;flex:none;margin-top:2px" />
          <span style="font-size:13px">Add the ${p.shopping.length} missing item${p.shopping.length === 1 ? "" : "s"} to my list
            ${p.cost.total > 0 ? `<br><span class="meta">about $${p.cost.total.toFixed(2)}${p.cost.unknown.length ? ` + ${p.cost.unknown.length} never bought before` : ""}</span>` : ""}
          </span>
        </label>
        ${p.shopping.length ? `<p class="meta" style="font-size:11px;margin-top:6px">
          ${p.shopping.slice(0, 6).map(i => esc(i.name)).join(", ")}${p.shopping.length > 6 ? `, +${p.shopping.length - 6} more` : ""}</p>` : ""}
      </div>

      <div style="display:flex;gap:6px;margin-top:12px">
        <button class="btn btn-green" id="planApply" ${planner.busy ? "disabled" : ""} style="flex:2">
          ${planner.busy ? "Saving…" : "Use this week"}</button>
        <button class="btn" id="planRetry" ${planner.busy ? "disabled" : ""}
          style="flex:1;background:#e7e5e4;color:#44403c">Try again</button>
      </div>
      <p class="meta" style="font-size:11px;text-align:center;margin-top:8px">Replaces anything already planned this week.</p>
      ${planner.error ? `<p class="err">${esc(planner.error)}</p>` : ""}
    </div>`;
}

function plannerPanel() {
  if (!planner) return "";
  return `<div class="parsed" style="margin-bottom:12px">
    <div class="parsed-head" style="display:flex;justify-content:space-between;align-items:center">
      <span>✨ Plan my week</span>
      <button class="ic" id="planClose" style="font-size:16px">✕</button>
    </div>
    ${planner.proposal ? plannerReview() : plannerForm()}
  </div>`;
}

// Reminder on/off row at the top of the Plan tab. Hidden entirely when the
// server has no VAPID keys or the browser can't do push.
function pushToggleRow() {
  if (!push.enabled || !pushSupported()) return "";
  const on = push.subscribed;
  return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;
      border:1px solid ${on ? "#a7f3d0" : "#e7e5e4"};background:${on ? "#ecfdf5" : "#fff"};
      border-radius:12px;padding:9px 12px;margin-bottom:12px">
      <span style="font-size:13px;font-weight:600">🔔 Cook &amp; thaw reminders<br>
        <span class="meta" style="font-weight:400">${on ? "on for this device" : "get a nudge when it's time to start or thaw"}</span></span>
      <button class="btn ${on ? "btn-dark" : "btn-green"}" id="pushToggle" ${push.busy ? "disabled" : ""}
        style="width:auto;padding:7px 14px;font-size:13px;flex:none">${push.busy ? "…" : on ? "Turn off" : "Turn on"}</button>
    </div>
    ${push.error ? `<p class="err">${esc(push.error)}</p>` : ""}`;
}

// "today 3:00 PM", "tomorrow 6:00 AM", "Fri 8:00 PM" — relative to now.
function thawWhenText(dt) {
  const now = new Date();
  const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const dayDiff = Math.round((startOfDay(dt) - startOfDay(now)) / 86400000);
  const t = fmtTime(`${String(dt.getHours()).padStart(2, "0")}:${String(dt.getMinutes()).padStart(2, "0")}`);
  if (dayDiff < 0) return `now (already past — thaw ASAP)`;
  if (dayDiff === 0) return `today ${t}`;
  if (dayDiff === 1) return `tomorrow ${t}`;
  return `${DOW[dt.getDay()]} ${t}`;
}

// Searchable, sortable list of saved recipes used when adding a meal to a day.
// Tap a row to select it; the highlighted row is what "Add to <day>" saves.
function recipePicker() {
  if (!saved.length)
    return `<p class="meta" style="text-align:center;padding:6px 0">No saved recipes yet — save one on the Recipe tab first.</p>`;

  const rows = recipeRows(saved, planSort, planSearch);
  const seg = (k, label) =>
    `<button data-plansort="${k}" style="flex:1;border:0;padding:6px 2px;border-radius:7px;font-size:11px;font-weight:500;cursor:pointer;${planSort === k ? "background:#fff;color:#1c1917;box-shadow:0 1px 2px rgba(0,0,0,.06)" : "background:none;color:#78716c"}">${label}</button>`;

  const picks = rows.map(({ r, cov, soon, via }) => {
    const on = String(r.id) === String(planAddRecipe);
    const makeable = cov.total > 0 && cov.have === cov.total;
    const badge = makeable
      ? `<span style="color:#059669;font-weight:600">✓ can make</span>`
      : `<span>${cov.have}/${cov.total} on hand</span>`;
    return `<button data-planpick="${r.id}" style="display:block;width:100%;text-align:left;cursor:pointer;

      <span class="meta" style="font-size:11px">${badge}${planSort === "expiring" ? soonTagHtml(soon) : ""}${via ? ` · has ${esc(via)}` : ""}</span>
    </button>`;
  }).join("");

  return `
    <div style="position:relative;display:flex;align-items:center;margin-bottom:6px">
      <input id="planSearch" value="${esc(planSearch)}" placeholder="Search recipes or ingredients…"
        autocapitalize="none" autocorrect="off"
        style="width:100%;padding:8px 30px 8px 10px;border:1px solid #d6d3d1;border-radius:8px;font-size:14px" />
      ${planSearch ? `<button id="planSearchClear" title="Clear search"
        style="position:absolute;right:6px;border:0;background:#e7e5e4;color:#57534e;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center">✕</button>` : ""}

      ${picks || `<p class="meta" style="text-align:center;padding:10px 0">No recipes match “${esc(planSearch)}”.</p>`}
    </div>
    ${rows.length && planSearch ? `<p class="meta" style="font-size:11px;text-align:right">${rows.length} of ${saved.length}</p>` : ""}`;
}

function planView() {
  if (!planWeekStart) planWeekStart = weekStartOf(new Date());
  const ws = planWeekStart;
  const we = addDays(ws, 6);
  const todayY = ymd(new Date());
  const label = `${MON[ws.getMonth()]} ${ws.getDate()} – ${MON[we.getMonth()]} ${we.getDate()}`;
  let html = pushToggleRow() + `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button class="ic" id="planPrev" style="border:1px solid #d6d3d1;border-radius:8px;padding:4px 10px">←</button>
      <span style="font-weight:600;font-size:15px">${label}</span>
      <button class="ic" id="planNext" style="border:1px solid #d6d3d1;border-radius:8px;padding:4px 10px">→</button>
    </div>`;
  if (saved.length >= 3 && !planner)
    html += `<button class="btn btn-sky" id="planOpen" style="margin-bottom:12px">✨ Plan my week</button>`;
  html += plannerPanel();
  if (!saved.length)
    html += `<p class="meta" style="text-align:center;margin-bottom:10px">Tip: save recipes first, then add them to days here.</p>`;

  for (let i = 0; i < 7; i++) {
    const day = addDays(ws, i);
    const dY = ymd(day);
    const isToday = dY === todayY;
    const dayMeals = meals.filter(m => m.date === dY);
    html += `<div style="border:1px solid ${isToday ? "#059669" : "#e7e5e4"};border-radius:12px;padding:10px 12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:600;font-size:14px">${DOW[day.getDay()]} ${day.getDate()}${isToday ? ` <span style="color:#059669;font-size:11px">• today</span>` : ""}</span>
        <button class="ic" data-planadd="${dY}" style="border:1px solid #d6d3d1;border-radius:8px;padding:2px 10px;font-size:13px">+ meal</button>
      </div>`;

    for (const m of dayMeals) {
      const rem = mealReminders(m);
      html += `<div style="margin-top:8px;padding:8px;background:#fafaf9;border-radius:8px">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
          <div style="flex:1">
            <span style="font-weight:600;font-size:14px">${esc(m.title)}</span>
            ${m.meal_time ? `<span class="meta"> · eat ${fmtTime(m.meal_time)}</span>` : ""}
            ${m.recipe && (m.recipe.prep_min || m.recipe.cook_min) ? `<br><span class="meta">${m.recipe.prep_min ? `prep ${minutesToText(m.recipe.prep_min)}` : ""}${m.recipe.prep_min && m.recipe.cook_min ? " · " : ""}${m.recipe.cook_min ? `cook ${minutesToText(m.recipe.cook_min)}` : ""}</span>` : ""}
            ${rem.start ? `<br><span class="meta" style="color:#0284c7;font-weight:600">▶ start cooking ~${rem.start}</span>` : ""}
            ${rem.thaw.length ? `<br><span class="meta" style="color:#d97706;font-weight:600">❄ thaw ahead: ${rem.thaw.join(", ")}</span>` : ""}
          </div>
          <button class="ic del" data-mealdel="${m.id}" style="flex:none">🗑</button>
        </div>
        ${m.recipe ? `<button class="btn btn-sky" data-mealopen="${m.recipe.id}" style="width:auto;padding:3px 10px;font-size:12px;margin-top:6px">Open recipe</button>` : ""}
      </div>`;
    }

    if (planAddDay === dY) {
      html += `<div style="margin-top:8px;padding:8px;background:#eff6ff;border-radius:8px">
        ${recipePicker()}
        <div style="display:flex;gap:6px;align-items:center;margin:8px 0 6px">
          <span class="meta">eat at</span>
          <input id="planTime" type="time" value="${planAddTime}" style="padding:6px;border:1px solid #d6d3d1;border-radius:8px;font-size:14px" />

        </div>
        ${err ? `<p class="err">${esc(err)}</p>` : ""}

    }
    html += `</div>`;
  }
  return html;
}

async function refresh() {
  const [p, l, s] = await Promise.all([api("/pantry"), api("/list"), api("/recipes")]);
  if (!Array.isArray(p) || !Array.isArray(l) || !Array.isArray(s)) { // session gone
    showAuth(); return;
  }
  pantry = p; list = l; saved = s;
  render();
}

async function loadMeals() {
  if (!planWeekStart) planWeekStart = weekStartOf(new Date());
  const from = ymd(planWeekStart), to = ymd(addDays(planWeekStart, 6));
  // load meals and refresh saved recipes together so the plan's recipe dropdown
  // (and the Saved tab) always reflect the current recipe list.
  const [r, s] = await Promise.all([api(`/meals?from=${from}&to=${to}`), api("/recipes")]);
  meals = Array.isArray(r) ? r : [];
  if (Array.isArray(s)) saved = s;
  render();
}

// Older recipes saved before time-estimation have prep_min/cook_min of 0.
// When one is opened, estimate its times once in the background and show them.
async function ensureRecipeTimes() {
  const r = viewing;
  if (!r || !r.id) return;
  if ((r.prep_min || 0) > 0 || (r.cook_min || 0) > 0) return; // already has times
  if (!(r.steps && r.steps.length) && !(r.ingredients && r.ingredients.length)) return;
  const est = await api(`/recipes/${r.id}/estimate-time`, { method: "POST" });
  if (est && !est.error && viewing && viewing.id === r.id) {
    viewing.prep_min = est.prep_min; viewing.cook_min = est.cook_min;
    render();
  }
}

async function savePlanMeal() {
  if (!planAddRecipe) { err = "Pick a recipe."; render(); return; }
  await api("/meals", J({ m: "POST", b: { date: planAddDay, meal_time: planAddTime, recipe_id: +planAddRecipe } }));
  planAddDay = null; err = "";
  loadMeals();
}

// render() replaces the whole view, which would drop a search box's caret and
// the result list's scroll position mid-search. Capture both and put them back
// afterwards. focusBack stays false for taps so the phone keyboard doesn't pop open.
function renderKeepingSearch(boxId, listId, focusBack) {
  const listEl = listId ? $("#" + listId) : null;
  const top = listEl ? listEl.scrollTop : 0;
  const box = $("#" + boxId);
  const caret = box ? [box.selectionStart, box.selectionEnd] : null;
  render();
  const listAfter = listId ? $("#" + listId) : null;
  if (listAfter) listAfter.scrollTop = top;
  const boxAfter = $("#" + boxId);
  if (boxAfter && focusBack) {
    boxAfter.focus();
    if (caret && caret[0] != null) boxAfter.setSelectionRange(caret[0], caret[1]);
  }
}

// ---------- Saved recipes ----------
// Recipes decorated with pantry coverage and soonest-expiring stock, filtered by
// an optional search query and ordered by `mode`. Shared by the Saved tab and
// the Plan tab's recipe picker so both sort the same way.
function recipeRows(recipes, mode, query) {
  const rows = [];
  for (const r of recipes) {
    const m = recipeMatch(r, query);
    if (m.hit) rows.push({ r, cov: recipeCoverage(r), soon: recipeSoonestExpiry(r), via: m.via });
  }
  const byTitle = (a, b) => (a.r.title || "").localeCompare(b.r.title || "");
  if (mode === "az") {
    rows.sort(byTitle);
  } else if (mode === "canmake") {
    const frac = (c) => c.total ? c.have / c.total : 0;
    rows.sort((a, b) => (frac(b.cov) - frac(a.cov)) || byTitle(a, b));
  } else if (mode === "expiring") {
    // recipes using the soonest-expiring stock first; recipes using nothing perishable sink
    rows.sort((a, b) => a.soon - b.soon);
  } // "recent" keeps server order (newest first)
  return rows;
}

// "uses 2d stock" / "uses expired" — only meaningful in the "Use soon" ordering.
function soonTagHtml(soon) {
  if (!isFinite(soon)) return "";
  const color = soon < 0 ? "#dc2626" : soon <= 3 ? "#d97706" : "#78716c";
  const text = soon < 0 ? "uses expired" : soon === 0 ? "uses today's" : `uses ${soon}d stock`;
  return `<span style="font-size:11px;font-weight:600;color:${color};margin-left:6px">${text}</span>`;
}

  let html = `

  html += rows.map(({ r, cov, soon, via }) => {
    const makeable = cov.total > 0 && cov.have === cov.total;

      ? `<span style="font-size:11px;font-weight:600;color:#059669;background:#ecfdf5;padding:2px 8px;border-radius:10px">✓ can make</span>`
      : `<span class="meta">${cov.have}/${cov.total} on hand</span>`;

    const soonTag = savedSort === "expiring" ? soonTagHtml(soon) : "";
    return `<div class="row">

      <button class="ic del" data-rdel="${r.id}">🗑</button>

  }).join("");
  return html;
}

// Render a per-serving nutrition panel from a nutrition object.
function nutritionBlock(n) {
  if (!n || (!n.calories && !n.protein && !n.carbs && !n.fat)) return "";
  const cell = (label, val, unit) => val == null ? "" :
    `<div style="text-align:center;flex:1">
       <div style="font-size:17px;font-weight:700">${Math.round(val)}${unit}</div>

      <div class="meta" style="font-weight:600;margin-bottom:8px">PER SERVING${n.servings ? ` · makes ${n.servings}` : ""} <span style="font-weight:400">(estimated)</span></div>

        ${cell("calories", n.calories, "")}${cell("protein", n.protein, "g")}${cell("carbs", n.carbs, "g")}${cell("fat", n.fat, "g")}
      </div>
    </div>`;
}

// pretty-print a possibly-fractional scaled quantity
function niceQty(n) {  const r = Math.round(n * 100) / 100;
  if (Number.isInteger(r)) return `${r}`;
  const frac = { 0.25: "¼", 0.5: "½", 0.75: "¾", 0.33: "⅓", 0.67: "⅔" };
  const whole = Math.floor(r), rem = Math.round((r - whole) * 100) / 100;
  if (frac[rem]) return whole ? `${whole} ${frac[rem]}` : frac[rem];
  return `${r}`;
}

// ---- step timers ------------------------------------------------------------
// Steps like "bake for 45 minutes" get a one-tap countdown that beeps when it's
// up. The running timer lives outside the view so it survives step changes,
// leaving cook mode, and switching tabs.

const DUR_UNITS = {
  h: 3600, hr: 3600, hrs: 3600, hour: 3600, hours: 3600,
  m: 60, min: 60, mins: 60, minute: 60, minutes: 60,
  s: 1, sec: 1, secs: 1, second: 1, seconds: 1,
};
const DUR_FRACS = { "½": 0.5, "¼": 0.25, "¾": 0.75, "⅓": 1 / 3, "⅔": 2 / 3 };
const DUR_RE = /(\d+(?:\.\d+)?|[½¼¾⅓⅔])\s*(?:(?:to|or|–|—|-)\s*(\d+(?:\.\d+)?))?\s*(hours?|hrs?|h|minutes?|mins?|m|seconds?|secs?|s)\b/gi;
const shortUnit = u => (DUR_UNITS[u.toLowerCase()] === 3600 ? "hr" : DUR_UNITS[u.toLowerCase()] === 60 ? "min" : "sec");

// Durations mentioned in a step, e.g. "bake 45-50 minutes" -> one 45 min timer.
// Ranges start at the low end so you check the food before it overcooks.
function parseDurations(text) {
  const raw = [];
  let m;
  DUR_RE.lastIndex = 0;
  while ((m = DUR_RE.exec(text))) {
    const unit = DUR_UNITS[m[3].toLowerCase()];
    const lo = DUR_FRACS[m[1]] != null ? DUR_FRACS[m[1]] : parseFloat(m[1]);
    const hi = m[2] ? parseFloat(m[2]) : null;
    if (!(lo > 0)) continue;
    raw.push({
      start: m.index, end: m.index + m[0].length, unit, ranged: hi != null,
      secs: Math.round(lo * unit),
      label: `${niceQty(lo)}${hi != null ? `–${niceQty(hi)}` : ""} ${shortUnit(m[3])}`,
    });
  }
  // "1 hour 30 minutes" is one timer, not two.
  const merged = [];
  for (const d of raw) {
    const prev = merged[merged.length - 1];
    const between = prev ? text.slice(prev.end, d.start).trim().replace(/^(and|,|&)$/i, "") : null;
    if (prev && between === "" && d.unit < prev.unit && !prev.ranged && !d.ranged) {
      prev.secs += d.secs; prev.label += ` ${d.label}`; prev.end = d.end;
    } else merged.push(d);
  }
  return merged
    .filter(d => d.secs >= 10 && d.secs <= 12 * 3600)
    .filter((d, i, a) => a.findIndex(x => x.secs === d.secs) === i);
}

function fmtClock(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(t / 3600);
  const mm = Math.floor((t % 3600) / 60), ss = t % 60;
  return h ? `${h}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`
           : `${mm}:${String(ss).padStart(2, "0")}`;
}

function startTimer(secs, name) {
  primeAudio();                       // this click is the gesture that unlocks audio
  stopAlarm();
  timer = { name, total: secs * 1000, leftMs: secs * 1000, endsAt: Date.now() + secs * 1000, running: true, done: false };
  if (!timerTick) timerTick = setInterval(tickTimer, 250);
  render();
}
function clearTimer() { stopAlarm(); timer = null; clearInterval(timerTick); timerTick = null; render(); }
function toggleTimer() {
  if (!timer || timer.done) return;
  if (timer.running) { timer.leftMs = Math.max(0, timer.endsAt - Date.now()); timer.running = false; }
  else { timer.endsAt = Date.now() + timer.leftMs; timer.running = true; }
  render();
}
function bumpTimer(ms) {
  if (!timer || timer.done) return;
  timer.total += ms;
  if (timer.running) timer.endsAt += ms; else timer.leftMs += ms;
  render();
}
function tickTimer() {
  if (!timer) { clearInterval(timerTick); timerTick = null; return; }
  if (timer.running) {
    timer.leftMs = Math.max(0, timer.endsAt - Date.now());
    if (timer.leftMs === 0) { timer.running = false; timer.done = true; startAlarm(); render(); return; }
  }
  paintTimer();   // cheap per-second update; a full render would steal focus elsewhere
}
function paintTimer() {
  if (!timer) return;
  const left = $("#timerLeft"); if (left) left.textContent = fmtClock(timer.leftMs);
  const fill = $("#timerFill");
  if (fill) fill.style.width = `${Math.max(0, Math.min(100, 100 - (timer.leftMs / timer.total) * 100))}%`;
}

function primeAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { audioCtx = null; }
}
function beep() {
  try {
    primeAudio();
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    for (let k = 0; k < 3; k++) {                      // three short rising pips
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), at = t0 + k * 0.32;
      osc.type = "sine"; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.35, at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.26);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(at); osc.stop(at + 0.3);
    }
  } catch (e) { /* audio blocked — the on-screen alert and vibration still fire */ }
  if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
}
// Keep ringing until it's acknowledged, but give up after a couple of minutes.
function startAlarm() {
  beep();
  let rings = 1;
  clearInterval(alarmLoop);
  alarmLoop = setInterval(() => {
    if (!timer || !timer.done || ++rings > 24) { stopAlarm(); return; }
    beep();
  }, 2500);
}
function stopAlarm() { clearInterval(alarmLoop); alarmLoop = null; }

// One button per duration found in the current step.
function timerButtons(step) {
  const durs = parseDurations(step);
  if (!durs.length) return "";
  return `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
    ${durs.map(d => `<button class="btn btn-sky" data-timer="${d.secs}" data-tlabel="${esc(d.label)}"
        style="width:auto;padding:8px 14px;font-size:14px">⏲ ${esc(d.label)} timer</button>`).join("")}
  </div>`;
}

// Fixed bar so the countdown stays visible from any view once it's running.
function timerWidget() {
  if (!timer) return "";
  const pct = Math.max(0, Math.min(100, 100 - (timer.leftMs / timer.total) * 100));
  return `<div style="position:fixed;left:0;right:0;bottom:0;z-index:900;display:flex;justify-content:center;padding:10px;pointer-events:none">
    <div style="pointer-events:auto;width:100%;max-width:420px;background:${timer.done ? "#059669" : "#1c1917"};color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25)">
      <div style="display:flex;align-items:center;gap:10px">
        <span id="timerLeft" style="font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px">${fmtClock(timer.leftMs)}</span>
        <span style="flex:1;font-size:13px;opacity:.9;line-height:1.3">${timer.done ? "⏰ Time's up!" : esc(timer.name) + (timer.running ? "" : " · paused")}</span>
        ${timer.done
          ? `<button class="btn" id="timerStop" style="width:auto;padding:8px 16px;background:#fff;color:#059669;font-weight:600">Stop</button>`
          : `<button class="ic" id="timerToggle" title="${timer.running ? "pause" : "resume"}" style="color:#fff;font-size:16px;width:auto;padding:4px 8px">${timer.running ? "⏸" : "▶"}</button>
             <button class="ic" id="timerAdd" title="add a minute" style="color:#fff;font-size:13px;width:auto;padding:4px 8px">+1m</button>
             <button class="ic" id="timerCancel" title="cancel timer" style="color:#fff;font-size:16px;width:auto;padding:4px 8px">✕</button>`}
      </div>
      <div style="height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:10px;overflow:hidden">
        <div id="timerFill" style="height:100%;background:#fff;width:${pct}%"></div>
      </div>
    </div>
  </div>`;
}

// Words that say how an ingredient is prepped rather than what it is — skipped
// when matching an ingredient name against the words of a step.
const ING_STOPWORDS = new Set([
  "fresh", "dried", "ground", "large", "small", "medium", "chopped", "minced", "diced", "sliced",
  "boneless", "skinless", "extra", "virgin", "unsalted", "salted", "all", "purpose", "whole",
  "low", "fat", "free", "raw", "cooked", "frozen", "canned", "organic", "and", "the", "plus",
  "optional", "for", "garnish", "room", "temperature", "finely", "coarsely", "thinly", "roughly",
  "shredded", "grated", "peeled", "softened", "melted", "divided", "packed", "granulated", "taste",
]);

// Rough singular/plural forms so "tomatoes" in a step matches a "tomato" ingredient.
function wordForms(w) {
  const out = new Set([w]);
  if (w.endsWith("ies")) out.add(w.slice(0, -3) + "y");
  else if (w.endsWith("es")) { out.add(w.slice(0, -2)); out.add(w.slice(0, -1)); }
  else if (w.endsWith("s")) out.add(w.slice(0, -1));
  else {
    out.add(w + "s"); out.add(w + "es");
    if (w.endsWith("y")) out.add(w.slice(0, -1) + "ies");
  }
  return [...out];
}
const wordsOf = s => new Set(String(s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().split(" "));

// True when a step's text mentions this ingredient by any meaningful word of its name.
function ingInStep(name, stepWords) {
  return [...wordsOf(name)]
    .filter(w => w.length >= 3 && !ING_STOPWORDS.has(w))
    .some(w => wordForms(w).some(f => stepWords.has(f)));
}

// Measurements shown alongside the current step so you never have to leave cook
// mode to check an amount: what this step uses up top, the rest behind a toggle.
function cookIngredientsPanel(r) {
  const ings = r.ingredients || [];
  if (!ings.length) return "";
  const stepWords = wordsOf(r.steps[cookStep] || "");
  const used = ings.filter(i => ingInStep(i.name, stepWords));
  const rest = ings.filter(i => !used.includes(i));
  const line = (i, strong) => {
    const amt = `${niceQty(i.use_qty * servings)} ${i.use_unit || ""}`.trim();
    return `<div style="display:flex;gap:10px;padding:3px 0;font-size:15px;${strong ? "font-weight:600;color:#1c1917" : "color:#57534e"}">
      <span style="flex:none;min-width:80px;text-align:right;color:#0284c7">${esc(amt)}</span>
      <span style="flex:1">${esc(i.name)}</span>
    </div>`;
  };
  return `
    <div style="margin-top:14px;background:#fff;border:1px solid #e7e5e4;border-radius:16px;padding:12px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span class="meta" style="font-weight:600">${used.length ? "FOR THIS STEP" : "INGREDIENTS"}${servings !== 1 ? ` · ×${niceQty(servings)} servings` : ""}</span>
        <button class="ic link" id="toggleCookIng" style="font-size:12px;border:0;background:none;cursor:pointer;color:#0284c7;width:auto">
          ${cookIngOpen ? "hide full list ▲" : `full list (${ings.length}) ▼`}
        </button>
      </div>
      ${used.length ? `<div style="margin-top:6px">${used.map(i => line(i, true)).join("")}</div>` : ""}
      ${cookIngOpen
        ? `<div style="margin-top:8px;${used.length ? "padding-top:8px;border-top:1px solid #f5f5f4" : ""}">${(used.length ? rest : ings).map(i => line(i, false)).join("")}</div>`
        : used.length ? "" : `<p class="meta" style="margin-top:6px">Nothing measured out for this step.</p>`}
    </div>`;
}

function cookModeView() {
  const r = viewing, n = r.steps.length, i = cookStep;
  const last = i === n - 1;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span class="name" style="font-weight:600;font-size:16px">${esc(r.title)}</span>
      <button class="ic" id="exitCook" style="font-size:18px">✕</button>
    </div>
    <div style="height:5px;background:#e7e5e4;border-radius:3px;margin-bottom:20px;overflow:hidden">
      <div style="height:100%;background:#059669;width:${((i + 1) / n) * 100}%;transition:width .2s"></div>
    </div>
    <div class="meta" style="font-weight:600;margin-bottom:8px">STEP ${i + 1} OF ${n}</div>
    <div style="font-size:22px;line-height:1.4;min-height:120px;padding:20px;background:#fff;border:1px solid #e7e5e4;border-radius:16px">
      ${esc(r.steps[i])}
    </div>
    ${timerButtons(r.steps[i])}
    ${cookIngredientsPanel(r)}
    <div class="actions" style="margin-top:20px">
      <button class="btn btn-dark" id="prevStep" ${i === 0 ? "disabled" : ""} style="flex:1">← Back</button>

        ? `<button class="btn btn-green" id="finishCook" style="flex:2">Done — subtract stock ✓</button>`
        : `<button class="btn btn-green" id="nextStep" style="flex:2">Next →</button>`}
    </div>
    <p style="font-size:12px;color:#a8a29e;margin-top:10px;text-align:center">Finishing subtracts this recipe's ingredients (×${niceQty(servings)}) from your pantry.</p>`;

// "2026-08" -> "Aug 2026"
function ymLabel(ym) {
  const [y, m] = (ym || "").split("-").map(Number);
  return MON[m - 1] ? `${MON[m - 1]} ${y}` : ym;
}
const money = (n) => "$" + (+n || 0).toFixed(2);

// Collapsible grocery-spend summary, fed by the prices read off receipts.
function spendPanel() {
  if (!spendOpen)
    return `<p style="text-align:center;margin-top:16px">
      <button class="ic link" id="spendToggle" style="font-size:12px;border:0;background:none;cursor:pointer;color:#0284c7;width:auto">💵 Spending</button>
    </p>`;

  let body;
  if (!spend) body = `<p class="meta" style="padding:12px;text-align:center">Loading…</p>`;
  else if (!spend.months.length)
    body = `<p class="meta" style="padding:12px;text-align:center">No prices yet. Add a receipt — the prices on it get tracked here.</p>`;
  else {
    const [thisMonth, lastMonth] = spend.months;
    const peak = Math.max(...spend.months.map(m => m.total), 1);
    const delta = lastMonth ? thisMonth.total - lastMonth.total : 0;
    body = `<div style="padding:12px">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:2px">
        <span style="font-size:24px;font-weight:700">${money(thisMonth.total)}</span>
        <span class="meta">in ${ymLabel(thisMonth.ym)}</span>
      </div>
      ${lastMonth ? `<p class="meta" style="margin-bottom:10px;color:${delta > 0 ? "#dc2626" : "#059669"};font-weight:600">
        ${delta > 0 ? "▲" : "▼"} ${money(Math.abs(delta))} vs ${ymLabel(lastMonth.ym)}</p>` : ""}
      ${spend.months.map(m => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span class="meta" style="width:62px;flex:none">${ymLabel(m.ym)}</span>
        <span style="flex:1;height:8px;background:#f5f5f4;border-radius:4px;overflow:hidden">
          <i style="display:block;height:100%;width:${Math.round(m.total * 100 / peak)}%;background:#059669"></i></span>
        <span class="meta" style="width:60px;text-align:right;flex:none">${money(m.total)}</span>
      </div>`).join("")}
    </div>`;

    if (spend.changes.length)
      body += `<div style="padding:10px 12px;border-top:1px solid #f5f5f4">
        <div class="meta" style="font-weight:600;margin-bottom:6px">PRICE CHANGES</div>
        ${spend.changes.map(c => `<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:3px">
          <span style="font-size:13px;text-transform:capitalize">${esc(c.name)}</span>
          <span class="meta" style="flex:none;color:${c.pct > 0 ? "#dc2626" : "#059669"};font-weight:600">
            ${money(c.unit)} <span style="font-weight:400;color:#a8a29e">was ${money(c.was)}</span> ${c.pct > 0 ? "▲" : "▼"}${Math.abs(c.pct)}%</span>
        </div>`).join("")}
      </div>`;

    if (spend.top.length)
      body += `<div style="padding:10px 12px;border-top:1px solid #f5f5f4">
        <div class="meta" style="font-weight:600;margin-bottom:6px">BIGGEST SPEND</div>
        ${spend.top.map(t => `<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:3px">
          <span style="font-size:13px;text-transform:capitalize">${esc(t.name)}</span>
          <span class="meta" style="flex:none">${money(t.total)}${t.n > 1 ? ` · ${t.n}×` : ""}</span>
        </div>`).join("")}
      </div>`;
  }

  return `<div class="parsed" style="margin-top:16px">
    <div class="parsed-head" style="display:flex;justify-content:space-between;align-items:center">
      <span>💵 Spending</span>
      <button class="ic" id="spendToggle" style="font-size:16px">✕</button>
    </div>${body}</div>`;
}

function pantryView() {
  let html = `<div class="addbar">
    <input id="pname" placeholder="Item" style="flex:1;min-width:120px" />
    <input id="pamt" placeholder="Amount" type="number" style="width:90px" />

  html += `<div style="display:flex;gap:6px;margin-bottom:6px">
    ${scanBtn("pantryPhotoBtn", "📷 Photo", pantryPhotoBusy && "Reading…")}
    ${scanBtn("barcodeBtn", "🏷️ Barcode", barcodeBusy && "Looking up…")}
    ${scanBtn("receiptBtn", "🧾 Receipt", receiptBusy && "Reading…")}

  if (barcodeManual != null) {
    html += `<div style="display:flex;gap:6px;margin-bottom:12px">
      <input id="barcodeCode" value="${esc(barcodeManual)}" inputmode="numeric" placeholder="Barcode number"
        style="flex:1;padding:8px 10px;border:1px solid #d6d3d1;border-radius:8px;font-size:14px" />
      <button class="btn btn-dark" id="barcodeGo" ${busy ? "disabled" : ""} style="width:auto;padding:0 14px">Look up</button>
      <button class="ic" id="barcodeManualClose" title="cancel">✕</button>
    </div>`;
  } else {
    html += `<p style="text-align:right;margin-bottom:12px">
      <button class="ic link" id="barcodeManualOpen" style="font-size:11px;border:0;background:none;cursor:pointer;color:#0284c7;width:auto">type a barcode number</button>
    </p>`;
  }

  if (receiptItems) {
    // Prices are tracked for everything you keep, food or not — the receipt total
    // is the receipt total.
    const kept = receiptItems.filter(x => x.use);
    const total = kept.reduce((s, x) => s + (+x.price || 0), 0);
    html += `<div class="parsed" style="margin-bottom:14px">
      <div class="parsed-head">Receipt — food items are checked; non-food is unchecked. Adjust and add.</div>`;
    receiptItems.forEach((it, i) => {
      const pkgs = it.pkg_base > 0 ? +(it.base / it.pkg_base).toFixed(2) : it.base;
      const nonFood = it.food === false;
      html += `<div class="pitem" style="gap:6px;align-items:center;flex-wrap:wrap;${nonFood ? "opacity:.55" : ""}">
        <input type="checkbox" data-ruse="${i}" ${it.use ? "checked" : ""} style="accent-color:#059669;width:16px;height:16px;flex:none" />
        <input data-rname="${i}" value="${esc(it.name)}" style="flex:2;min-width:80px;border:1px solid #e7e5e4;border-radius:6px;padding:5px 7px;font-size:13px" />
        ${nonFood ? `<span class="meta" style="font-size:10px;background:#f5f5f4;padding:1px 5px;border-radius:6px;flex:none">non-food</span>` : ""}
        <input data-rpkg="${i}" value="${esc(pkgs)}" inputmode="decimal" title="how many you bought"
          style="width:48px;border:1px solid #e7e5e4;border-radius:6px;padding:5px 4px;font-size:13px;text-align:center" />
        <span class="meta" style="min-width:52px;max-width:80px">${esc(it.pkg_label || "each")}</span>
        <span class="meta" style="flex:none">$</span>
        <input data-rprice="${i}" value="${it.price ? esc(it.price) : ""}" inputmode="decimal" placeholder="—" title="what this line cost"
          style="width:56px;border:1px solid #e7e5e4;border-radius:6px;padding:5px 4px;font-size:13px;text-align:right" />
      </div>`;
    });
    html += `<div style="padding:8px 12px;background:#fafaf9;border-top:1px solid #f5f5f4;display:flex;justify-content:space-between">
        <span class="meta">${kept.length} item${kept.length === 1 ? "" : "s"} checked</span>
        <span class="meta" style="font-weight:600">${total > 0 ? "$" + total.toFixed(2) : "no prices read"}</span>
      </div>
      <div class="actions" style="padding:12px">
        <button class="btn btn-green" id="receiptConfirm">Add ${kept.length} to pantry</button>
        <button class="btn btn-dark" id="receiptCancel">Cancel</button>
      </div></div>`;
  }

  if (pantryPending) {
    const p = pantryPending;
    html += `<div class="parsed" style="margin-bottom:14px">
      <div class="parsed-head">Found this — adjust if needed, then add</div>
      ${p.product ? `<div style="padding:8px 12px 0"><span class="meta">scanned: ${esc([p.brand, p.product].filter(Boolean).join(" "))}</span></div>` : ""}
      <div class="pitem" style="gap:6px;align-items:center;flex-wrap:wrap">
        <input id="ppName" value="${esc(p.name)}" style="flex:2;min-width:100px;border:1px solid #e7e5e4;border-radius:6px;padding:6px 8px;font-size:14px" />
        <input id="ppAmt" value="${esc(p.base)}" inputmode="decimal" style="width:70px;border:1px solid #e7e5e4;border-radius:6px;padding:6px;font-size:14px;text-align:center" />
        <span class="meta" style="min-width:40px">${esc(p.base_unit)}</span>
        <span class="meta">≈ ${p.pkg_base ? (p.base / p.pkg_base).toFixed(1) : "?"} ${esc(p.pkg_label)}</span>
      </div>
      <div class="actions" style="padding:12px">
        <button class="btn btn-green" id="ppConfirm">Add to pantry</button>
        <button class="btn btn-dark" id="ppCancel">Cancel</button>
      </div>
    </div>`;
  }
  if (err && tab === "pantry") html += `<p class="err">${esc(err)}</p>`;
  const groups = groupedPantry();
  if (!groups.length) html += `<p class="empty">Pantry is empty. Purchased items land here automatically.</p>`;
  else html += groups.map(g => {
    const pk = pkgsFromBase(g.base, g.pkg_base);
    const pct = Math.max(0, Math.min(100, pk * 100 / Math.max(1, Math.ceil(pk))));
    const exp = g.expLabel;
    const toneColor = exp ? { bad: "#dc2626", warn: "#d97706", ok: "#059669" }[exp.tone] : "";
    const o = g.oldest;
    const sl = o.shelf_life;
    const states = sl ? STORAGE_STATES.filter(s => typeof sl[s] === "number") : [];
    const cur = o.storage || (sl && sl.where) || "";
    const storageSel = states.length > 1
      ? `<select data-pstore="${o.id}" style="font-size:11px;padding:2px 4px;border:1px solid #e7e5e4;border-radius:6px;color:#57534e">
          ${states.map(s => `<option value="${s}" ${s === cur ? "selected" : ""}>${s}</option>`).join("")}
        </select>`
      : "";
    const batchNote = g.batches.length > 1 ? ` · ${g.batches.length} batches` : "";
    const useOpen = pantryUse && norm(pantryUse.name) === norm(g.name);
    return `<div class="row"${useOpen ? ` style="margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0"` : ""}>
      <span style="flex:1">
        <span class="name">${esc(g.name)}</span><br>
        <span class="meta">${showBase(g.base, g.base_unit)} · ≈${pk.toFixed(1)} ${esc(g.pkg_label)}${pk === 1 ? "" : "s"}${batchNote}</span>
        ${exp ? `<br><span class="meta" style="color:${toneColor};font-weight:600">${exp.text}${g.batches.length > 1 ? " (oldest)" : ""}</span>` : ""}
      </span>
      ${storageSel}
      <span class="bar"><i style="width:${pct}%"></i></span>
      <button class="ic" data-poldest="${o.id}" data-d="-1" title="use one package (oldest first)">−</button>
      <button class="ic" data-puse="${esc(g.name)}" title="use a specific amount"
        style="font-size:11px;border:1px solid #e7e5e4;border-radius:8px;padding:3px 6px;white-space:nowrap;${useOpen ? "background:#f5f5f4;color:#44403c" : ""}">− amt</button>
      <button class="ic del" data-pgroupdel="${esc(g.name)}" title="remove all of this item">🗑</button>
    </div>${useOpen ? pantryUseEditor(g, pantryUse) : ""}`;
  }).join("");
  return html + spendPanel();
}

function wire() {
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
    recipeMode = b.dataset.mode; err = ""; render();
  });
  const mn = $("#mName"); if (mn) mn.oninput = e => manualName = e.target.value;
  const mi = $("#mIng"); if (mi) mi.oninput = e => manualIngredients = e.target.value;
  const md = $("#mDir"); if (md) md.oninput = e => manualDirections = e.target.value;
  const ms = $("#mSave"); if (ms) ms.onclick = saveManualRecipe;

  const pp = $("#photoPick"); const pi = $("#photoInput");
  if (pp && pi) {
    pp.onclick = () => pi.click();
    pi.onchange = () => { if (pi.files && pi.files[0]) addPhotoPage(pi.files[0]); pi.value = ""; };
  }
  const prd = $("#photoRead"); if (prd) prd.onclick = readPhotoPages;
  document.querySelectorAll("[data-photodel]").forEach(b => b.onclick = () => {
    photoImages.splice(+b.dataset.photodel, 1); render();
  });

  const raw = $("#raw"); if (raw) raw.oninput = e => rawRecipe = e.target.value;
  const url = $("#url");
  if (url) url.oninput = e => {
    const was = recipeUrl.length > 0;
    recipeUrl = e.target.value;
    const now = recipeUrl.length > 0;
    if (was !== now) { render(); const el = $("#url"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  };
  const uc = $("#urlClear");
  if (uc) uc.onclick = () => { recipeUrl = ""; render(); const el = $("#url"); if (el) el.focus(); };
  const ex = $("#extract"); if (ex) ex.onclick = () => extract({ recipe: rawRecipe });
  const fu = $("#fromUrl"); if (fu) fu.onclick = () => extract({ url: recipeUrl });
  document.querySelectorAll("[data-use]").forEach(c => c.onchange = () => parsed[+c.dataset.use].use = c.checked);
  // inline ingredient edits — mark dirty so amounts get re-computed on save/add
  document.querySelectorAll("[data-ename]").forEach(el => el.oninput = () => { parsed[+el.dataset.ename].name = el.value; parsedDirty = true; });
  document.querySelectorAll("[data-eqty]").forEach(el => el.oninput = () => { parsed[+el.dataset.eqty].use_qty = el.value; parsedDirty = true; });
  document.querySelectorAll("[data-eunit]").forEach(el => el.oninput = () => { parsed[+el.dataset.eunit].use_unit = el.value; parsedDirty = true; });
  document.querySelectorAll("[data-edel]").forEach(b => b.onclick = () => { parsed.splice(+b.dataset.edel, 1); parsedDirty = true; render(); });
  const ai = $("#addIng"); if (ai) ai.onclick = () => {
    parsed.push({ name: "", use_qty: "", use_unit: "", base_unit: "count", use_base: 0, pkg_label: "each", pkg_base: 1, use: true });
    parsedDirty = true; render();
    const inputs = document.querySelectorAll("[data-ename]"); if (inputs.length) inputs[inputs.length - 1].focus();
  };
  const pt = $("#pTitle"); if (pt) pt.oninput = () => { parsedTitle = pt.value; };
  const tl = $("#toList"); if (tl) tl.onclick = () => addToListEdited(false);
  const tla = $("#toListAll"); if (tla) tla.onclick = () => addToListEdited(true);
  const ck = $("#cook"); if (ck) ck.onclick = () => cookEdited();
  const sv = $("#save"); if (sv) sv.onclick = saveRecipe;

  // plan tab
  const plPrev = $("#planPrev"); if (plPrev) plPrev.onclick = () => { planWeekStart = addDays(planWeekStart, -7); planAddDay = null; loadMeals(); };
  const plNext = $("#planNext"); if (plNext) plNext.onclick = () => { planWeekStart = addDays(planWeekStart, 7); planAddDay = null; loadMeals(); };
  document.querySelectorAll("[data-planadd]").forEach(b => b.onclick = () => {
    planAddDay = b.dataset.planadd; planAddRecipe = ""; planSearch = ""; err = ""; render();
  });
  const psr = $("#planSearch");
  if (psr) {
    psr.oninput = () => { planSearch = psr.value; renderPicker(true); };
    psr.onkeydown = e => {
      if (e.key !== "Enter") return;
      // one match left? Enter picks it, so search-then-Enter selects in two moves.
      const rows = recipeRows(saved, planSort, planSearch);
      if (rows.length === 1) { planAddRecipe = String(rows[0].r.id); err = ""; renderPicker(false); }
    };
  }
  const psc = $("#planSearchClear"); if (psc) psc.onclick = () => { planSearch = ""; renderPicker(true); };
  document.querySelectorAll("[data-plansort]").forEach(b => b.onclick = () => { planSort = b.dataset.plansort; render(); });
  const pushBtn = $("#pushToggle");
  if (pushBtn) pushBtn.onclick = () => push.subscribed ? disablePush() : enablePush();

  const planOpenBtn = $("#planOpen");
  if (planOpenBtn) planOpenBtn.onclick = () => { planner = emptyPlanner(); render(); };
  const planCloseBtn = $("#planClose");
  if (planCloseBtn) planCloseBtn.onclick = () => { planner = null; render(); };
  // Constraint fields write straight to state so typing never triggers a
  // re-render, which would drop the caret mid-word.
  document.querySelectorAll("[data-pc]").forEach(el => el.oninput = () => {
    planner.constraints[el.dataset.pc] = el.value;
  });
  const planGoBtn = $("#planGo"); if (planGoBtn) planGoBtn.onclick = generatePlan;
  const planRetryBtn = $("#planRetry");
  if (planRetryBtn) planRetryBtn.onclick = () => { planner.proposal = null; generatePlan(); };
  const planApplyBtn = $("#planApply"); if (planApplyBtn) planApplyBtn.onclick = applyPlan;
  const planListChk = $("#planAddList");
  if (planListChk) planListChk.onchange = () => { planner.addToList = planListChk.checked; };
  document.querySelectorAll("[data-planpick]").forEach(b => b.onclick = () => {

// Subtract the typed amount from one item's stock (oldest batch first).
async function applyPantryUse() {
  const u = pantryUse;
  if (!u) return;
  const g = groupedPantry().find(x => norm(x.name) === norm(u.name));
  if (!g) { pantryUse = null; render(); return; }
  const amt = +u.amt;
  if (!(amt > 0)) { err = "Enter an amount greater than 0."; render(); return; }
  const useBase = useBaseAmount(g, u);
  if (useBase > g.base + 0.01) {
    err = `You only have ${showBase(g.base, g.base_unit)} of ${g.name} — remove less, or use 🗑 to clear it out.`;
    render(); return;
  }
  err = "";
  const r = await api("/pantry/use", J({ m: "POST", b: { name: g.name, use_base: useBase } }));
  if (r && r.error) { err = r.error; render(); return; }
  pantryUse = null;
  refresh();
}

async function extract({ recipe, url }) {

  parsing = true; err = ""; parsed = null; render();
  try {

    if (r.error) throw new Error(r.error);
    if (!r.items || r.items.length === 0) {
      err = url?.trim()
        ? "That link didn't give a usable recipe — the site may block automated reads. Paste the recipe text instead."
        : "Couldn't find ingredients in that text. Make sure the ingredient list is included.";
      parsed = null;

    }
    parsed = r.items.map(x => ({ ...x, use: true }));
    parsedTitle = r.title || "";
    parsedSteps = r.steps || [];
    parsedSource = r.source_url || "";
    parsedNutrition = r.nutrition || null; parsedPrep = r.prep_min || 0; parsedCook = r.cook_min || 0;

  } catch (e) {
    err = "Couldn't read that recipe. Check the link, or paste the text instead.";
  } finally {

}

// If the ingredient list was hand-edited, re-run the parser on the edited names
// so package/base amounts (used for shopping + stock) match what you typed.
async function reparseIfDirty() {
  if (!parsedDirty) return true;
  const usable = parsed.filter(p => (p.name || "").trim());
  if (!usable.length) { err = "Add at least one ingredient."; render(); return false; }
  const lines = usable.map(p => `${p.use_qty || ""} ${p.use_unit || ""} ${p.name}`.trim()).join("\n");
  parsing = true; err = ""; render();
  try {
    const r = await api("/parse", J({ m: "POST", b: { recipe: `TITLE: ${parsedTitle || "Recipe"}\n\nINGREDIENTS:\n${lines}` } }));
    if (r.error) throw new Error(r.error);
    if (!r.items || !r.items.length) throw new Error("Couldn't re-read the edited ingredients.");
    // keep each row's use flag by position where possible
    parsed = r.items.map((x, i) => ({ ...x, use: usable[i] ? usable[i].use !== false : true }));
    parsedDirty = false;
    return true;
  } catch (e) {
    err = e && e.message ? e.message : "Couldn't process the edits.";
    return false;
  } finally {
    parsing = false;
  }
}

// Downscale an image file and return { dataUrl, base64, mediaType }.
function readAndShrinkImage(file, maxDim = 1400) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale); height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      resolve({ dataUrl, base64: dataUrl.split(",")[1], mediaType: "image/jpeg" });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

// Read a PDF (or any file) straight to base64, no canvas.
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve({ base64: String(r.result).split(",")[1], mediaType: file.type || "application/pdf", dataUrl: r.result });
    r.onerror = () => reject(new Error("read failed"));
    r.readAsDataURL(file);
  });
}

// Images get downscaled; PDFs pass through untouched.
async function readUpload(file, maxDim = 1400) {
  if (file.type === "application/pdf") return fileToBase64(file);
  return readAndShrinkImage(file, maxDim);
}

async function addPhotoPage(file) {
  err = "";
  // A PDF is a whole recipe in one file — parse it directly rather than adding
  // it to the multi-page photo strip.
  if (file.type === "application/pdf") {
    parsing = true; render();
    try {
      const { base64, mediaType, dataUrl } = await fileToBase64(file);
      const r = await api("/parse", J({ m: "POST", b: { image: base64, image_type: mediaType } }));
      if (r.error) throw new Error(r.error);
      if (!r.items || !r.items.length) throw new Error("No ingredients found in that PDF. Try a clearer file, or type it in.");
      parsed = r.items.map(x => ({ ...x, use: true }));
      parsedTitle = r.title || "";
      parsedSteps = r.steps || [];
      parsedSource = "";
      parsedNutrition = r.nutrition || null; parsedPrep = r.prep_min || 0; parsedCook = r.cook_min || 0;
      parsedPhotos = [dataUrl]; // the PDF itself, opened via the source link
      parsedDirty = false;
      photoImages = [];
      recipeMode = "import";
    } catch (e) {
      err = e && e.message ? e.message : "Couldn't read that PDF.";
    } finally {
      parsing = false; render();
    }
    return;
  }
  try {
    const im = await readAndShrinkImage(file);
    photoImages.push(im);
    render();
  } catch (e) {
    err = "Couldn't load that image."; render();
  }
}

async function addToList(items, ignoreStock = false) {
  try {
    if (!items || !items.length) { err = "No ingredients to add."; render(); return; }
    let added = 0, skipped = [];
    for (const p of items) {
      const useBase = Number(p.use_base) || 0;
      const pkgBase = Number(p.pkg_base) || 1;
      const haveBase = pantry.filter(x => norm(x.name) === norm(p.name)).reduce((s, x) => s + x.base, 0);
      const needBase = ignoreStock ? useBase : useBase - haveBase;
      if (needBase <= 0) { skipped.push(p.name); continue; }
      const packages = Math.max(1, Math.ceil(needBase / pkgBase));
      const existing = list.find(x => norm(x.name) === norm(p.name));
      if (existing) await api(`/list/${existing.id}`, J({ m: "PATCH", b: { packages: existing.packages + packages } }));
      else await api("/list", J({ m: "POST", b: {
        name: p.name, packages, base_unit: p.base_unit || "count", pkg_label: p.pkg_label || "each", pkg_base: pkgBase
      }}));
      added++;
    }
    if (added === 0) {
      await refresh();
      err = skipped.length
        ? `Already stocked: ${skipped.join(", ")}. Use “Add all” to add them anyway.`
        : "Nothing selected to add.";
      render();
      return;
    }
    err = "";
    parsed = null; rawRecipe = ""; recipeUrl = ""; viewing = null; tab = "list";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === "list"));
    refresh();
  } catch (e) {
    err = "Couldn't add to the list: " + (e && e.message ? e.message : e);
    render();
  }
}

async function cook(items) {
  try {
    await api("/cook", J({ m: "POST", b: { items: items.map(p => ({ name: p.name, use_base: p.use_base })) } }));
    err = "";
    parsed = null; rawRecipe = ""; recipeUrl = "";
    refresh();
  } catch (e) {
    err = "Couldn't subtract stock: " + (e && e.message ? e.message : e);
    render();
  }
}

// Ask the server for shelf-life data for a set of item names. Best-effort:
// returns a name->info map (may be empty). Never throws.
async function fetchShelfLife(names) {
  try {
    const r = await api("/shelf-life", J({ m: "POST", b: { names } }));
    return (r && r.results) || {};
  } catch { return {}; }
}

async function addPantry() {
  const name = $("#pname").value, amt = +$("#pamt").value || 0, unitKey = $("#punit").value;
  if (!name.trim()) return;
  const u = unitByKey(unitKey);
  const baseAmt = +(amt * u.factor).toFixed(2);   // convert to g / ml / count
  const label = u.key === "count" ? "each" : `${amt} ${u.key}`;
  const sl = (await fetchShelfLife([name]))[name.toLowerCase()] || null;
  // Each add is its own dated batch; the view groups batches by name.
  await api("/pantry", J({ m: "POST", b: {
    name, base: baseAmt, base_unit: u.base, pkg_label: label, pkg_base: baseAmt || 1,
    storage: sl ? sl.where : "", shelf_life: sl
  }}));
  refresh();
}

async function pantryFromPhoto(file) {
  err = ""; pantryPhotoBusy = true; pantryPending = null; render();
  try {
    const { base64, mediaType } = await readUpload(file);
    const r = await api("/pantry-photo", J({ m: "POST", b: { image: base64, image_type: mediaType } }));
    if (r.error) throw new Error(r.error);
    pantryPending = { name: r.name, base: r.base, base_unit: r.base_unit, pkg_label: r.pkg_label, pkg_base: r.pkg_base };
  } catch (e) {
    err = e && e.message ? e.message : "Couldn't read that photo.";
  } finally {
    pantryPhotoBusy = false; render();
  }
}

async function confirmPantryPhoto() {
  const p = pantryPending;
  if (!p || !p.name.trim()) { err = "Give the item a name."; render(); return; }
  const sl = (await fetchShelfLife([p.name.trim()]))[p.name.trim().toLowerCase()] || null;
  await api("/pantry", J({ m: "POST", b: {
    name: p.name.trim(), base: p.base, base_unit: p.base_unit, pkg_label: p.pkg_label, pkg_base: p.pkg_base || 1,
    storage: sl ? sl.where : "", shelf_life: sl
  }}));
  pantryPending = null; err = "";
  refresh();
}

// Decode a barcode out of a still photo without a round trip, where the browser
// can do it (Chrome/Android). Safari has no BarcodeDetector, so this returns ""
// there and the photo goes to the server for the model to read instead.
async function decodeBarcodeLocally(file) {
  try {
    if (!("BarcodeDetector" in window)) return "";
    const formats = await window.BarcodeDetector.getSupportedFormats();
    const want = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"].filter(f => formats.includes(f));
    if (!want.length) return "";
    const bitmap = await createImageBitmap(file);
    const found = await new window.BarcodeDetector({ formats: want }).detect(bitmap);
    bitmap.close();
    return (found[0] && found[0].rawValue || "").replace(/\D/g, "");
  } catch { return ""; }
}

// Shared tail of every scan path (local decode, photo read, typed number):
// look the code up and drop the result into the same review box the item-photo
// flow uses.
async function lookupBarcode(body, codeForRetry) {
  err = ""; barcodeBusy = true; pantryPending = null; render();
  try {
    const r = await api("/barcode", J({ m: "POST", b: body }));
    if (r.error) { barcodeManual = r.code || codeForRetry || ""; throw new Error(r.error); }
    pantryPending = { name: r.name, base: r.base, base_unit: r.base_unit,
      pkg_label: r.pkg_label, pkg_base: r.pkg_base, product: r.product, brand: r.brand };
    barcodeManual = null;
  } catch (e) {
    err = e && e.message ? e.message : "Couldn't look up that barcode.";
  } finally {
    barcodeBusy = false; render();
  }
}

async function barcodeFromPhoto(file) {
  err = ""; barcodeBusy = true; render();
  const code = await decodeBarcodeLocally(file);
  if (code) return lookupBarcode({ code }, code);
  try {
    const { base64, mediaType } = await readUpload(file, 1600); // small digits — keep detail
    return await lookupBarcode({ image: base64, image_type: mediaType });
  } catch (e) {
    err = e && e.message ? e.message : "Couldn't read that photo.";
    barcodeBusy = false; render();
  }
}

async function receiptFromPhoto(file) {
  err = ""; receiptBusy = true; receiptItems = null; render();
  try {
    const { base64, mediaType } = await readUpload(file, 1600); // receipts are text-dense; keep more detail
    const r = await api("/receipt", J({ m: "POST", b: { image: base64, image_type: mediaType } }));
    if (r.error) throw new Error(r.error);
    if (!r.items || !r.items.length) throw new Error("No items found on that receipt.");
    // Food items start checked; non-food (household, toiletries, etc.) start unchecked
    // but stay visible so you can re-check anything misclassified.
    receiptItems = r.items.map(x => ({ ...x, use: x.food !== false }));
  } catch (e) {
    err = e && e.message ? e.message : "Couldn't read that receipt.";
  } finally {
    receiptBusy = false; render();
  }
}

async function confirmReceipt() {
  const chosen = (receiptItems || []).filter(x => x.use && x.name.trim());
  if (!chosen.length) { receiptItems = null; render(); return; }
  // Merge duplicate lines (same item bought twice) into one total before adding.
  const merged = [];
  for (const it of chosen) {
    const m = merged.find(x => norm(x.name) === norm(it.name));
    if (m) m.base = +(m.base + it.base).toFixed(2);
    else merged.push({ name: it.name.trim(), base: it.base, base_unit: it.base_unit, pkg_label: it.pkg_label, pkg_base: it.pkg_base || 1 });
  }
  // One batched shelf-life lookup for all the new items.
  const slMap = await fetchShelfLife(merged.map(m => m.name));
  for (const it of merged) {
    // Each receipt adds a new dated batch; grouping happens in the view.
    const sl = slMap[it.name.toLowerCase()] || null;
    await api("/pantry", J({ m: "POST", b: { ...it, storage: sl ? sl.where : "", shelf_life: sl } }));
  }
  // Record what the trip cost, line by line — lines with no price are skipped.
  // Kept separate from the pantry merge so each receipt line stays its own entry.
  const priced = chosen.filter(x => +x.price > 0).map(x => ({
    name: x.name.trim(), price: +x.price, packages: +x.packages || 1, source: "receipt",
  }));
  if (priced.length) {
    try { await api("/purchases", J({ m: "POST", b: { items: priced, ym: ymd(new Date()).slice(0, 7) } })); }
    catch { /* the pantry add already landed; spend tracking is a bonus */ }
    spend = null;
    if (spendOpen) loadSpend();
  }
  receiptItems = null; err = "";
  refresh();
}

async function loadSpend() {
  try { spend = await api("/spend?months=6"); }
  catch { spend = { months: [], top: [], changes: [] }; }
  if (tab === "pantry" && spendOpen) render();
}

// ---------- auth screen + boot ----------
let authMode = "login", authErr = "", needsInvite = false;

function authScreen() {
  const field = (id, ph, type) =>
    `<input id="${id}" placeholder="${ph}" type="${type || "text"}" autocapitalize="none" autocorrect="off"
      style="width:100%;padding:11px 12px;border:1px solid #d6d3d1;border-radius:10px;font-size:15px;margin-bottom:10px" />`;
  const isReg = authMode === "register";
  return `
    <p class="sub" style="text-align:center">Sign in to your kitchen.</p>
    <div style="max-width:340px;margin:16px auto 0">
      <div style="display:flex;gap:4px;background:rgba(214,211,209,.4);padding:4px;border-radius:12px;margin-bottom:16px">
        <button data-auth="login" style="flex:1;border:0;padding:8px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;${!isReg ? "background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)" : "background:none;color:#78716c"}">Log in</button>
        <button data-auth="register" style="flex:1;border:0;padding:8px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;${isReg ? "background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)" : "background:none;color:#78716c"}">Create account</button>
      </div>
      ${field("authUser", "Username")}
      ${field("authPass", "Password", "password")}
      ${isReg && needsInvite ? field("authInvite", "Invite code") : ""}
      ${authErr ? `<p class="err">${esc(authErr)}</p>` : ""}
      <button class="btn btn-green" id="authGo">${isReg ? "Create account" : "Log in"}</button>
    </div>`;
}

function wireAuth() {
  document.querySelectorAll("[data-auth]").forEach(b => b.onclick = () => { authMode = b.dataset.auth; authErr = ""; showAuth(); });
  const go = $("#authGo"); if (go) go.onclick = submitAuth;
  ["authUser", "authPass", "authInvite"].forEach(id => { const el = $("#" + id); if (el) el.onkeydown = e => { if (e.key === "Enter") submitAuth(); }; });
}

function showAuth() {
  $("#app").style.display = "none";
  $("#auth").style.display = "block";
  $("#auth").innerHTML = authScreen();
  wireAuth();
}

async function submitAuth() {
  const username = ($("#authUser") || {}).value || "";
  const password = ($("#authPass") || {}).value || "";
  const invite = ($("#authInvite") || {}).value || "";
  authErr = "";
  const path = authMode === "register" ? "/register" : "/login";
  const r = await api(path, J({ m: "POST", b: { username, password, invite } }));
  if (r.error) { authErr = r.error; showAuth(); return; }
  await startApp();
}

async function startApp() {
  $("#auth").style.display = "none";
  $("#app").style.display = "block";
  tab = "recipe"; viewing = null;
  await refresh();
  initPush().then(() => { if (tab === "plan") render(); }); // in the background — never gates the UI
}

async function boot() {
  const me = await api("/me");
  needsInvite = !!(me && me.needsInvite);
  if (me && me.user) await startApp();
  else showAuth();
}

const logoutBtn = $("#logout");
if (logoutBtn) logoutBtn.onclick = async () => { await api("/logout", { method: "POST" }); authMode = "login"; showAuth(); };

boot();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
}
</script>
