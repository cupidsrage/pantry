<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pantry &amp; List</title>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#059669" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pantry" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; background: #fafaf9; color: #292524; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; letter-spacing: -.02em; }
  .sub { font-size: 14px; color: #78716c; margin: 2px 0 20px; }
  .tabs { display: flex; gap: 4px; background: rgba(214,211,209,.4); padding: 4px; border-radius: 12px; margin-bottom: 20px; }
  .tab { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; font-size: 14px; font-weight: 500; color: #78716c; cursor: pointer; }
  .tab.active { background: #fff; color: #1c1917; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  textarea { width: 100%; height: 176px; padding: 12px; border: 1px solid #d6d3d1; border-radius: 12px; font-size: 14px; resize: none; font-family: inherit; }
  textarea:focus, input:focus { outline: 2px solid #34d399; }
  .btn { border: 0; border-radius: 12px; padding: 10px; font-size: 14px; font-weight: 500; color: #fff; cursor: pointer; width: 100%; }
  .btn-green { background: #059669; } .btn-green:hover { background: #047857; }
  .btn-dark { background: #44403c; } .btn-dark:hover { background: #292524; }
  .btn-sky { background: #0284c7; } .btn-sky:hover { background: #0369a1; }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid #e7e5e4; background: #fff; border-radius: 12px; margin-bottom: 8px; }
  .row.checked { border-color: #a7f3d0; background: #ecfdf5; }
  .name { font-size: 14px; text-transform: capitalize; }
  .name.done { text-decoration: line-through; color: #a8a29e; }
  .meta { font-size: 12px; color: #78716c; }
  .qty { font-size: 12px; color: #57534e; min-width: 40px; text-align: center; }
  .ic { border: 0; background: none; cursor: pointer; color: #a8a29e; padding: 4px; font-size: 15px; line-height: 1; }
  .ic:hover { color: #44403c; }
  .ic.del:hover { color: #ef4444; } .ic.link { color: #0284c7; text-decoration: none; }
  .check { width: 24px; height: 24px; border: 1px solid #d6d3d1; border-radius: 6px; background: none; cursor: pointer; color: #fff; }
  .check.on { background: #059669; border-color: #059669; }
  .empty { text-align: center; color: #a8a29e; font-size: 14px; padding: 40px 0; }
  .parsed { border: 1px solid #e7e5e4; border-radius: 12px; overflow: hidden; margin-top: 16px; }
  .parsed-head { padding: 8px 12px; background: #f5f5f4; font-size: 12px; font-weight: 600; color: #78716c; text-transform: uppercase; }
  .pitem { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-top: 1px solid #f5f5f4; font-size: 14px; }
  .stock { font-size: 12px; color: #059669; font-weight: 500; }
  .addbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .addbar input { padding: 8px 12px; border: 1px solid #d6d3d1; border-radius: 8px; font-size: 14px; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .err { color: #dc2626; font-size: 14px; margin-top: 8px; }
  .mt { margin-top: 12px; }
  .bar { height: 5px; background: #e7e5e4; border-radius: 3px; overflow: hidden; width: 64px; }
  .bar > i { display: block; height: 100%; background: #059669; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pantry &amp; List</h1>
  <p class="sub">Paste a recipe, build your list, track what's in stock.</p>
  <div class="tabs">
    <button class="tab active" data-tab="recipe">Recipe</button>
    <button class="tab" data-tab="list">List</button>
    <button class="tab" data-tab="pantry">Pantry</button>
    <button class="tab" data-tab="saved">Saved</button>
  </div>
  <div id="view"></div>
</div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const api = (p, opt) => fetch("/api" + p, opt).then(r => r.json());
const norm = s => s.toLowerCase().trim().replace(/s$/, "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wm = n => `https://www.walmart.com/search?q=${encodeURIComponent(n)}`;
const J = o => ({ method: o.m, headers: { "content-type": "application/json" }, body: JSON.stringify(o.b) });

// Purchase units the user can pick, each mapping to a base unit (g / ml / count)
// with a factor: amount * factor = base amount. label is what shows in the dropdown.
const UNITS = [
  { key: "count",  label: "count / each", base: "count", factor: 1 },
  { key: "g",      label: "grams (g)",    base: "g",     factor: 1 },
  { key: "kg",     label: "kilograms (kg)", base: "g",   factor: 1000 },
  { key: "oz",     label: "ounces (oz)",  base: "g",     factor: 28.35 },
  { key: "lb",     label: "pounds (lb)",  base: "g",     factor: 453.6 },
  { key: "ml",     label: "milliliters (ml)", base: "ml", factor: 1 },
  { key: "l",      label: "liters (L)",   base: "ml",    factor: 1000 },
  { key: "floz",   label: "fluid oz",     base: "ml",    factor: 29.57 },
  { key: "cup",    label: "cups",         base: "ml",    factor: 236.6 },
  { key: "tbsp",   label: "tablespoons",  base: "ml",    factor: 14.79 },
  { key: "tsp",    label: "teaspoons",    base: "ml",    factor: 4.93 },
  { key: "stick",  label: "sticks butter", base: "g",   factor: 113 },
  { key: "can",    label: "cans (~400g)", base: "g",     factor: 400 },
  { key: "clove",  label: "cloves",       base: "count", factor: 1 },
];
const unitByKey = (k) => UNITS.find(u => u.key === k) || UNITS[0];

function showBase(base, unit) {
  if (unit === "count") return `${+base.toFixed(1)}`;
  if (unit === "g") return base >= 1000 ? `${(base/1000).toFixed(2)} kg` : `${Math.round(base)} g`;
  if (unit === "ml") return base >= 1000 ? `${(base/1000).toFixed(2)} L` : `${Math.round(base)} ml`;
  return `${+base.toFixed(1)} ${unit}`;
}
function pkgsFromBase(base, pkgBase) { return pkgBase > 0 ? base / pkgBase : 0; }

let tab = "recipe", pantry = [], list = [], parsed = null, rawRecipe = "", parsing = false, err = "";
let recipeUrl = "", parsedTitle = "", parsedSteps = [], parsedSource = "", parsedNutrition = null;
let saved = [], viewing = null, servings = 1, cookStep = -1;
let shopping = false;
let recipeMode = "import";  // "import" (link/paste), "manual", or "photo"
let manualName = "", manualIngredients = "", manualDirections = "";
let parsedDirty = false;      // ingredient list was hand-edited since parse
let photoImages = [];         // multiple pages: [{base64, mediaType, dataUrl}]
let savedSort = "recent";     // "recent" | "az" | "canmake"

async function refresh() {
  [pantry, list, saved] = await Promise.all([api("/pantry"), api("/list"), api("/recipes")]);
  render();
}

document.querySelectorAll(".tab").forEach(b =>
  b.onclick = () => {
    tab = b.dataset.tab; viewing = null; err = "";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === b));
    render();
  });

function render() {
  $("#view").innerHTML =
    tab === "recipe" ? recipeView() :
    tab === "list" ? listView() :
    tab === "pantry" ? pantryView() :
    savedView();
  wire();
}

function recipeView() {
  const seg = (m, label) =>
    `<button class="segbtn ${recipeMode === m ? "active" : ""}" data-mode="${m}" style="flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;${recipeMode === m ? "background:#fff;color:#1c1917;box-shadow:0 1px 2px rgba(0,0,0,.06)" : "color:#78716c"}">${label}</button>`;
  let html = `
    <div style="display:flex;gap:4px;background:rgba(214,211,209,.4);padding:4px;border-radius:12px;margin-bottom:16px">
      ${seg("import", "Link / paste")}${seg("manual", "Type it in")}${seg("photo", "Photo")}
    </div>`;

  if (recipeMode === "manual") {
    html += `
      <input id="mName" placeholder="Recipe name" value="${esc(manualName)}"
        style="width:100%;padding:10px 12px;border:1px solid #d6d3d1;border-radius:10px;font-size:15px;margin-bottom:10px" />
      <div class="meta" style="font-weight:600;margin-bottom:4px">INGREDIENTS — one per line</div>
      <textarea id="mIng" placeholder="2 cloves garlic&#10;1 cup flour&#10;4 large potatoes&#10;1/2 lb bacon"
        style="height:130px;margin-bottom:12px">${esc(manualIngredients)}</textarea>
      <div class="meta" style="font-weight:600;margin-bottom:4px">DIRECTIONS — one step per line</div>
      <textarea id="mDir" placeholder="Preheat oven to 350°F&#10;Bake potatoes 1 hour&#10;Scoop, mix, and refill"
        style="height:130px;margin-bottom:12px">${esc(manualDirections)}</textarea>
      <button class="btn btn-green" id="mSave" ${parsing ? "disabled" : ""}>
        ${parsing ? "Saving…" : "Save recipe"}</button>
      ${err ? `<p class="err">${esc(err)}</p>` : ""}
      <p class="meta" style="margin-top:8px;text-align:center">Ingredient amounts get sized for shopping automatically, same as an imported recipe.</p>`;
    return html;
  }

  if (recipeMode === "photo") {
    const thumbs = photoImages.map((im, i) => `
      <div style="position:relative;display:inline-block;margin:4px">
        <img src="${im.dataUrl}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #d6d3d1" />
        <button class="ic del" data-photodel="${i}" title="remove"
          style="position:absolute;top:-8px;right:-8px;background:#fff;border:1px solid #d6d3d1;border-radius:50%;width:20px;height:20px;font-size:11px;line-height:1">✕</button>
        <span style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 4px;border-radius:4px">${i + 1}</span>
      </div>`).join("");
    html += `
      <div style="border:2px dashed #d6d3d1;border-radius:14px;padding:22px 16px;text-align:center;margin-bottom:12px">
        <p class="meta" style="margin-bottom:14px">Photograph a recipe card — handwritten or printed. Add more than one for a multi-page recipe.</p>
        <input id="photoInput" type="file" accept="image/*" style="display:none" />
        ${thumbs ? `<div style="margin-bottom:12px">${thumbs}</div>` : ""}
        <button class="btn" id="photoPick" ${parsing ? "disabled" : ""}
          style="max-width:260px;margin:0 auto 8px;background:#e7e5e4;color:#44403c">
          ${photoImages.length ? "+ Add another page" : "📷 Choose / take photo"}</button>
        ${photoImages.length ? `<button class="btn btn-green" id="photoRead" ${parsing ? "disabled" : ""} style="max-width:260px;margin:0 auto">
          ${parsing ? "Reading…" : `Read ${photoImages.length} page${photoImages.length > 1 ? "s" : ""}`}</button>` : ""}
      </div>
      ${err ? `<p class="err">${esc(err)}</p>` : ""}
      <p class="meta" style="text-align:center">Clear, well-lit, straight-on photos read best. Messy handwriting may need a retry.</p>`;
    return html;
  }

  html += `
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <div style="flex:1;position:relative;display:flex;align-items:center">
        <input id="url" placeholder="Paste a recipe link (https://…)" value="${esc(recipeUrl)}"
          style="width:100%;padding:10px 34px 10px 12px;border:1px solid #d6d3d1;border-radius:10px;font-size:14px" />
        ${recipeUrl ? `<button id="urlClear" title="Clear link"
          style="position:absolute;right:6px;border:0;background:#e7e5e4;color:#57534e;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center">✕</button>` : ""}
      </div>
      <button class="btn btn-dark" id="fromUrl" style="width:auto;padding:0 16px" ${parsing ? "disabled" : ""}>Fetch</button>
    </div>
    <p class="meta" style="text-align:center;margin-bottom:10px">— or paste the text below —</p>
    <textarea id="raw" placeholder="Paste a full recipe or just its ingredient list here…">${esc(rawRecipe)}</textarea>
    <button class="btn btn-green mt" id="extract" ${parsing ? "disabled" : ""}>
      ${parsing ? "Reading recipe…" : "Extract ingredients"}</button>
    ${err ? `<p class="err">${esc(err)}</p>` : ""}`;
  if (parsed) {
    html += `<div class="parsed">
      <div class="parsed-head" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <input id="pTitle" value="${esc(parsedTitle || "")}" placeholder="Recipe name"
          style="flex:1;border:1px solid #d6d3d1;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600" />
        <button class="btn btn-sky" id="save" style="width:auto;padding:5px 12px;font-size:12px">Save</button>
      </div>
      <div class="meta" style="padding:8px 12px 0;font-weight:600">INGREDIENTS — edit, remove, or add below</div>`;
    parsed.forEach((p, i) => {
      const have = pantry.find(x => norm(x.name) === norm(p.name));
      html += `<div class="pitem" style="gap:6px;align-items:center">
        <input type="checkbox" data-use="${i}" ${p.use ? "checked" : ""} style="accent-color:#059669;width:16px;height:16px;flex:none" />
        <input data-ename="${i}" value="${esc(p.name || "")}" placeholder="ingredient"
          style="flex:2;min-width:80px;border:1px solid #e7e5e4;border-radius:6px;padding:5px 7px;font-size:13px" />
        <input data-eqty="${i}" value="${esc(p.use_qty ?? "")}" inputmode="decimal" placeholder="qty"
          style="width:46px;border:1px solid #e7e5e4;border-radius:6px;padding:5px 4px;font-size:13px;text-align:center" />
        <input data-eunit="${i}" value="${esc(p.use_unit || "")}" placeholder="unit"
          style="width:60px;border:1px solid #e7e5e4;border-radius:6px;padding:5px 4px;font-size:13px" />
        <button class="ic del" data-edel="${i}" title="remove" style="flex:none">🗑</button>
      </div>
      ${have ? `<div class="meta" style="padding:0 12px 4px 40px;color:#059669">have ${showBase(have.base, have.base_unit)} in stock</div>` : ""}`;
    });
    html += `<div style="padding:8px 12px">
      <button class="btn" id="addIng" style="width:auto;padding:6px 12px;font-size:13px;background:#e7e5e4;color:#44403c">+ Add ingredient</button>
    </div>`;
    if (parsedSteps.length)
      html += `<div style="padding:10px 12px;border-top:1px solid #f5f5f4">
        <div class="meta" style="font-weight:600;margin-bottom:6px">STEPS</div>
        <ol style="padding-left:18px;font-size:14px;line-height:1.5">${parsedSteps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
      </div>`;
    html += nutritionBlock(parsedNutrition);
    html += `<div style="padding:12px;background:#fafaf9;border-top:1px solid #f5f5f4">
      <div class="actions" style="margin-top:0">
        <button class="btn btn-green" id="toList">Add needed → List</button>
        <button class="btn btn-sky" id="toListAll">Add all → List</button>
      </div>
      <button class="btn btn-dark" id="cook" style="margin-top:8px">Cooked it → subtract stock</button>
      ${parsedDirty ? `<p class="meta" style="margin-top:8px;text-align:center">Edited — amounts will be re-sized for shopping when you Save or add to list.</p>` : ""}
    </div></div>`;
  }
  return html;
}

// ---------- Saved recipes ----------
// How many of a recipe's ingredients the pantry can cover right now → {have, total}.
function recipeCoverage(r) {
  const ings = r.ingredients || [];
  let have = 0;
  for (const ing of ings) {
    const inPantry = pantry.find(x => norm(x.name) === norm(ing.name));
    if (inPantry && inPantry.base >= (ing.use_base || 0)) have++;
  }
  return { have, total: ings.length };
}

function savedView() {
  if (viewing) return recipeDetailView();
  if (!saved.length) return `<p class="empty">No saved recipes yet. Parse one on the Recipe tab and tap “Save”.</p>`;

  const seg = (k, label) =>
    `<button data-sort="${k}" style="flex:1;border:0;padding:8px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;${savedSort === k ? "background:#fff;color:#1c1917;box-shadow:0 1px 2px rgba(0,0,0,.06)" : "background:none;color:#78716c"}">${label}</button>`;
  let html = `<div style="display:flex;gap:4px;background:rgba(214,211,209,.4);padding:4px;border-radius:12px;margin-bottom:14px">
      ${seg("recent", "Recent")}${seg("az", "A–Z")}${seg("canmake", "Can make")}
    </div>`;

  // build a display list with coverage, then sort
  let rows = saved.map(r => ({ r, cov: recipeCoverage(r) }));
  if (savedSort === "az") {
    rows.sort((a, b) => (a.r.title || "").localeCompare(b.r.title || ""));
  } else if (savedSort === "canmake") {
    // fully-makeable first, then by fraction of ingredients on hand
    const frac = (c) => c.total ? c.have / c.total : 0;
    rows.sort((a, b) => (frac(b.cov) - frac(a.cov)) || (a.r.title || "").localeCompare(b.r.title || ""));
  } // "recent" keeps server order (newest first)

  html += rows.map(({ r, cov }) => {
    const makeable = cov.total > 0 && cov.have === cov.total;
    const badge = makeable
      ? `<span style="font-size:11px;font-weight:600;color:#059669;background:#ecfdf5;padding:2px 8px;border-radius:10px">✓ can make</span>`
      : `<span class="meta">${cov.have}/${cov.total} on hand</span>`;
    return `<div class="row">
      <span style="flex:1" data-open-recipe="${r.id}" role="button">
        <span class="name">${esc(r.title)}</span><br>
        ${badge}
      </span>
      <button class="btn btn-sky" data-open-recipe="${r.id}" style="width:auto;padding:6px 14px">Open</button>
      <button class="ic del" data-rdel="${r.id}">🗑</button>
    </div>`;
  }).join("");
  return html;
}

// Render a per-serving nutrition panel from a nutrition object.
function nutritionBlock(n) {
  if (!n || (!n.calories && !n.protein && !n.carbs && !n.fat)) return "";
  const cell = (label, val, unit) => val == null ? "" :
    `<div style="text-align:center;flex:1">
       <div style="font-size:17px;font-weight:700">${Math.round(val)}${unit}</div>
       <div class="meta">${label}</div>
     </div>`;
  return `<div style="padding:10px 12px;border-top:1px solid #f5f5f4">
      <div class="meta" style="font-weight:600;margin-bottom:8px">PER SERVING${n.servings ? ` · makes ${n.servings}` : ""} <span style="font-weight:400">(estimated)</span></div>
      <div style="display:flex;gap:6px">
        ${cell("calories", n.calories, "")}${cell("protein", n.protein, "g")}${cell("carbs", n.carbs, "g")}${cell("fat", n.fat, "g")}
      </div>
    </div>`;
}

// pretty-print a possibly-fractional scaled quantity
function niceQty(n) {  const r = Math.round(n * 100) / 100;
  if (Number.isInteger(r)) return `${r}`;
  const frac = { 0.25: "¼", 0.5: "½", 0.75: "¾", 0.33: "⅓", 0.67: "⅔" };
  const whole = Math.floor(r), rem = Math.round((r - whole) * 100) / 100;
  if (frac[rem]) return whole ? `${whole} ${frac[rem]}` : frac[rem];
  return `${r}`;
}

function recipeDetailView() {
  const r = viewing;
  if (cookStep >= 0) return cookModeView();
  return `
    <button class="ic" id="backSaved" style="font-size:14px;margin-bottom:8px">← all recipes</button>
    <div class="parsed">
      <div class="parsed-head" style="display:flex;justify-content:space-between;align-items:center">
        <span>${esc(r.title)}</span>
        ${r.source_url ? `<a class="ic link" href="${esc(r.source_url)}" target="_blank" rel="noreferrer" style="font-size:12px">source ↗</a>` : ""}
      </div>
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #f5f5f4">
        <span class="meta" style="font-weight:600">SERVINGS ×</span>
        <button class="ic" id="servDown" style="font-size:18px;border:1px solid #d6d3d1;border-radius:8px;width:30px">−</button>
        <span style="font-size:15px;min-width:28px;text-align:center;font-weight:600">${niceQty(servings)}</span>
        <button class="ic" id="servUp" style="font-size:18px;border:1px solid #d6d3d1;border-radius:8px;width:30px">+</button>
        ${servings !== 1 ? `<span class="meta">amounts scaled</span>` : ""}
      </div>
      <div style="padding:10px 12px">
        <div class="meta" style="font-weight:600;margin-bottom:6px">INGREDIENTS</div>
        <ul style="padding-left:18px;font-size:14px;line-height:1.6">
          ${r.ingredients.map(i => `<li>${niceQty(i.use_qty * servings)} ${esc(i.use_unit)} ${esc(i.name)}</li>`).join("")}
        </ul>
      </div>
      ${r.steps.length ? `<div style="padding:10px 12px;border-top:1px solid #f5f5f4">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span class="meta" style="font-weight:600">STEPS</span>
          <button class="btn btn-sky" id="startCook" style="width:auto;padding:5px 14px;font-size:12px">▶ Start cooking</button>
        </div>
        <ol style="padding-left:18px;font-size:14px;line-height:1.6">${r.steps.map(s => `<li style="margin-bottom:6px">${esc(s)}</li>`).join("")}</ol>
      </div>` : ""}
      ${nutritionBlock(r.nutrition)}
      ${err ? `<p class="err" style="padding:0 12px">${esc(err)}</p>` : ""}
      <div style="padding:12px;background:#fafaf9;border-top:1px solid #f5f5f4">
        <div class="actions" style="margin-top:0">
          <button class="btn btn-green" id="rToList">Add needed → List</button>
          <button class="btn btn-sky" id="rToListAll">Add all → List</button>
        </div>
        <button class="btn btn-dark" id="rCook" style="margin-top:8px">Cooked it → subtract stock</button>
      </div>
    </div>`;
}

function cookModeView() {
  const r = viewing, n = r.steps.length, i = cookStep;
  const last = i === n - 1;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span class="name" style="font-weight:600;font-size:16px">${esc(r.title)}</span>
      <button class="ic" id="exitCook" style="font-size:18px">✕</button>
    </div>
    <div style="height:5px;background:#e7e5e4;border-radius:3px;margin-bottom:20px;overflow:hidden">
      <div style="height:100%;background:#059669;width:${((i + 1) / n) * 100}%;transition:width .2s"></div>
    </div>
    <div class="meta" style="font-weight:600;margin-bottom:8px">STEP ${i + 1} OF ${n}</div>
    <div style="font-size:22px;line-height:1.4;min-height:120px;padding:20px;background:#fff;border:1px solid #e7e5e4;border-radius:16px">
      ${esc(r.steps[i])}
    </div>
    <div class="actions" style="margin-top:20px">
      <button class="btn btn-dark" id="prevStep" ${i === 0 ? "disabled" : ""} style="flex:1">← Back</button>
      ${last
        ? `<button class="btn btn-green" id="finishCook" style="flex:2">Done — subtract stock ✓</button>`
        : `<button class="btn btn-green" id="nextStep" style="flex:2">Next →</button>`}
    </div>
    <p style="font-size:12px;color:#a8a29e;margin-top:10px;text-align:center">Finishing subtracts this recipe's ingredients (×${niceQty(servings)}) from your pantry.</p>`;
}

function listView() {
  if (!list.length) return `<p class="empty">Nothing on the list yet. Add a recipe's ingredients from the Recipe tab.</p>`;
  let shop = shopping ? shopView() + `<div style="height:16px"></div>` : "";
  let html = shop + list.map(it => `
    <div class="row ${it.checked ? "checked" : ""}">
      <button class="check ${it.checked ? "on" : ""}" data-check="${it.id}">${it.checked ? "✓" : ""}</button>
      <span style="flex:1">
        <span class="name ${it.checked ? "done" : ""}">${esc(it.name)}</span><br>
        <span class="meta">${esc(it.pkg_label)}</span>
      </span>
      <button class="ic" data-lqty="${it.id}" data-d="-1">−</button>
      <span class="qty">${it.packages} ×</span>
      <button class="ic" data-lqty="${it.id}" data-d="1">+</button>
      <a class="ic link" href="${wm(it.name)}" target="_blank" rel="noreferrer" title="Find on Walmart">↗</a>
      <button class="ic del" data-ldel="${it.id}">🗑</button>
    </div>`).join("");
  html += `<div class="actions">
    <button class="btn btn-green" id="purchase" ${list.some(x => x.checked) ? "" : "disabled"}>Mark checked as purchased → Pantry</button>
    <button class="btn btn-sky" id="shop" style="width:auto;padding:10px 16px" ${list.some(x => !x.checked) ? "" : "disabled"}>🛒 Shop on Walmart</button>
  </div>
  <p style="font-size:12px;color:#a8a29e;margin-top:8px;text-align:center">Buying adds the full package to your pantry stock.</p>`;
  return html;
}

function shopView() {
  const items = list.filter(x => !x.checked);
  let html = `<div class="parsed"><div class="parsed-head" style="display:flex;justify-content:space-between;align-items:center">
    <span>Shopping — tap each to open its Walmart search</span>
    <button class="ic" id="shopClose" style="font-size:18px">✕</button></div>`;
  items.forEach(it => {
    html += `<div class="pitem" style="justify-content:space-between">
      <span style="flex:1"><span class="name">${esc(it.name)}</span> <span class="meta">${it.packages} × ${esc(it.pkg_label)}</span></span>
      <a class="btn btn-sky" style="width:auto;padding:6px 14px;text-decoration:none" href="${wm(it.name)}" target="_blank" rel="noreferrer">Open ↗</a>
      <button class="check" data-scheck="${it.id}" title="mark checked">✓</button>
    </div>`;
  });
  html += `<div style="padding:10px 12px;background:#fafaf9;border-top:1px solid #f5f5f4;font-size:12px;color:#78716c">
    Check items off as you add them to your Walmart cart.</div></div>`;

}

function pantryView() {
  let html = `<div class="addbar">
    <input id="pname" placeholder="Item" style="flex:1;min-width:120px" />
    <input id="pamt" placeholder="Amount" type="number" style="width:90px" />
    <select id="punit" style="padding:8px;border:1px solid #d6d3d1;border-radius:8px;font-size:14px;max-width:130px">
      ${UNITS.map(u => `<option value="${u.key}">${u.label}</option>`).join("")}
    </select>
    <button class="btn btn-dark" id="padd" style="width:auto;padding:0 14px">+</button>
  </div>`;
  if (!pantry.length) html += `<p class="empty">Pantry is empty. Purchased items land here automatically.</p>`;
  else html += pantry.map(it => {
    const pk = pkgsFromBase(it.base, it.pkg_base);
    const pct = Math.max(0, Math.min(100, pk * 100 / Math.max(1, Math.ceil(pk))));
    return `<div class="row">
      <span style="flex:1">
        <span class="name">${esc(it.name)}</span><br>
        <span class="meta">${showBase(it.base, it.base_unit)} · ≈${pk.toFixed(1)} ${esc(it.pkg_label)}${pk === 1 ? "" : "s"}</span>
      </span>
      <span class="bar"><i style="width:${pct}%"></i></span>
      <button class="ic" data-pqty="${it.id}" data-d="-1" title="use one package">−</button>
      <button class="ic" data-pqty="${it.id}" data-d="1" title="add one package">+</button>
      <button class="ic del" data-pdel="${it.id}">🗑</button>
    </div>`;
  }).join("");
  return html;
}

function wire() {
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
    recipeMode = b.dataset.mode; err = ""; render();
  });
  const mn = $("#mName"); if (mn) mn.oninput = e => manualName = e.target.value;
  const mi = $("#mIng"); if (mi) mi.oninput = e => manualIngredients = e.target.value;
  const md = $("#mDir"); if (md) md.oninput = e => manualDirections = e.target.value;
  const ms = $("#mSave"); if (ms) ms.onclick = saveManualRecipe;

  const pp = $("#photoPick"); const pi = $("#photoInput");
  if (pp && pi) {
    pp.onclick = () => pi.click();
    pi.onchange = () => { if (pi.files && pi.files[0]) addPhotoPage(pi.files[0]); pi.value = ""; };
  }
  const prd = $("#photoRead"); if (prd) prd.onclick = readPhotoPages;
  document.querySelectorAll("[data-photodel]").forEach(b => b.onclick = () => {
    photoImages.splice(+b.dataset.photodel, 1); render();
  });

  const raw = $("#raw"); if (raw) raw.oninput = e => rawRecipe = e.target.value;
  const url = $("#url");
  if (url) url.oninput = e => {
    const was = recipeUrl.length > 0;
    recipeUrl = e.target.value;
    const now = recipeUrl.length > 0;
    if (was !== now) { render(); const el = $("#url"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  };
  const uc = $("#urlClear");
  if (uc) uc.onclick = () => { recipeUrl = ""; render(); const el = $("#url"); if (el) el.focus(); };
  const ex = $("#extract"); if (ex) ex.onclick = () => extract({ recipe: rawRecipe });
  const fu = $("#fromUrl"); if (fu) fu.onclick = () => extract({ url: recipeUrl });
  document.querySelectorAll("[data-use]").forEach(c => c.onchange = () => parsed[+c.dataset.use].use = c.checked);
  // inline ingredient edits — mark dirty so amounts get re-computed on save/add
  document.querySelectorAll("[data-ename]").forEach(el => el.oninput = () => { parsed[+el.dataset.ename].name = el.value; parsedDirty = true; });
  document.querySelectorAll("[data-eqty]").forEach(el => el.oninput = () => { parsed[+el.dataset.eqty].use_qty = el.value; parsedDirty = true; });
  document.querySelectorAll("[data-eunit]").forEach(el => el.oninput = () => { parsed[+el.dataset.eunit].use_unit = el.value; parsedDirty = true; });
  document.querySelectorAll("[data-edel]").forEach(b => b.onclick = () => { parsed.splice(+b.dataset.edel, 1); parsedDirty = true; render(); });
  const ai = $("#addIng"); if (ai) ai.onclick = () => {
    parsed.push({ name: "", use_qty: "", use_unit: "", base_unit: "count", use_base: 0, pkg_label: "each", pkg_base: 1, use: true });
    parsedDirty = true; render();
    const inputs = document.querySelectorAll("[data-ename]"); if (inputs.length) inputs[inputs.length - 1].focus();
  };
  const pt = $("#pTitle"); if (pt) pt.oninput = () => { parsedTitle = pt.value; };
  const tl = $("#toList"); if (tl) tl.onclick = () => addToListEdited(false);
  const tla = $("#toListAll"); if (tla) tla.onclick = () => addToListEdited(true);
  const ck = $("#cook"); if (ck) ck.onclick = () => cookEdited();
  const sv = $("#save"); if (sv) sv.onclick = saveRecipe;

  // saved tab
  document.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => { savedSort = b.dataset.sort; render(); });
  document.querySelectorAll("[data-open-recipe]").forEach(b => b.onclick = async () => {
    viewing = await api(`/recipes/${b.dataset.openRecipe}`); servings = 1; cookStep = -1; err = ""; render();
  });
  document.querySelectorAll("[data-rdel]").forEach(b => b.onclick = async () => {
    await api(`/recipes/${b.dataset.rdel}`, { method: "DELETE" }); refresh();
  });
  const bk = $("#backSaved"); if (bk) bk.onclick = () => { viewing = null; render(); };
  const scaleItems = () => viewing.ingredients.map(i => ({ ...i, use_base: i.use_base * servings }));
  const rtl = $("#rToList"); if (rtl) rtl.onclick = () => addToList(scaleItems());
  const rtla = $("#rToListAll"); if (rtla) rtla.onclick = () => addToList(scaleItems(), true);
  const rck = $("#rCook"); if (rck) rck.onclick = () => cook(scaleItems());
  const sd = $("#servDown"); if (sd) sd.onclick = () => { servings = Math.max(0.5, +(servings - 0.5).toFixed(1)); render(); };
  const su = $("#servUp"); if (su) su.onclick = () => { servings = +(servings + 0.5).toFixed(1); render(); };
  const start = $("#startCook"); if (start) start.onclick = () => { cookStep = 0; render(); };
  const exit = $("#exitCook"); if (exit) exit.onclick = () => { cookStep = -1; render(); };
  const prev = $("#prevStep"); if (prev) prev.onclick = () => { cookStep = Math.max(0, cookStep - 1); render(); };
  const next = $("#nextStep"); if (next) next.onclick = () => { cookStep = Math.min(viewing.steps.length - 1, cookStep + 1); render(); };
  const fin = $("#finishCook"); if (fin) fin.onclick = async () => {
    await cook(scaleItems());
    cookStep = -1; viewing = null; servings = 1; tab = "saved";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === "saved"));
    render();
  };

  document.querySelectorAll("[data-check]").forEach(b => b.onclick = async () => {
    const it = list.find(x => x.id == b.dataset.check);
    await api(`/list/${it.id}`, J({ m: "PATCH", b: { checked: !it.checked } })); refresh();
  });
  document.querySelectorAll("[data-lqty]").forEach(b => b.onclick = async () => {
    const it = list.find(x => x.id == b.dataset.lqty);
    const p = Math.max(1, it.packages + (+b.dataset.d));
    await api(`/list/${it.id}`, J({ m: "PATCH", b: { packages: p } })); refresh();
  });
  document.querySelectorAll("[data-ldel]").forEach(b => b.onclick = async () => { await api(`/list/${b.dataset.ldel}`, { method: "DELETE" }); refresh(); });
  const pu = $("#purchase"); if (pu) pu.onclick = async () => { await api("/purchase", { method: "POST" }); refresh(); };
  const sh = $("#shop"); if (sh) sh.onclick = () => {
    shopping = true;
    const first = list.find(x => !x.checked);
    if (first) window.open(wm(first.name), "_blank");
    render();
  };
  const sc = $("#shopClose"); if (sc) sc.onclick = () => { shopping = false; render(); };
  document.querySelectorAll("[data-scheck]").forEach(b => b.onclick = async () => {
    await api(`/list/${b.dataset.scheck}`, J({ m: "PATCH", b: { checked: true } })); refresh();
  });

  const pa = $("#padd"); if (pa) pa.onclick = addPantry;
  document.querySelectorAll("[data-pqty]").forEach(b => b.onclick = async () => {
    const it = pantry.find(x => x.id == b.dataset.pqty);
    const nb = Math.max(0, +(it.base + (+b.dataset.d) * it.pkg_base).toFixed(2));
    await api(`/pantry/${it.id}`, J({ m: "PATCH", b: { base: nb } })); refresh();
  });
  document.querySelectorAll("[data-pdel]").forEach(b => b.onclick = async () => { await api(`/pantry/${b.dataset.pdel}`, { method: "DELETE" }); refresh(); });
}

async function extract({ recipe, url }) {
  if (!recipe?.trim() && !url?.trim()) return;
  parsing = true; err = ""; parsed = null; render();
  try {
    const r = await api("/parse", J({ m: "POST", b: url?.trim() ? { url } : { recipe } }));
    if (r.error) throw new Error(r.error);
    if (!r.items || r.items.length === 0) {
      err = url?.trim()
        ? "That link didn't give a usable recipe — the site may block automated reads. Paste the recipe text instead."
        : "Couldn't find ingredients in that text. Make sure the ingredient list is included.";
      parsed = null;
      return;
    }
    parsed = r.items.map(x => ({ ...x, use: true }));
    parsedTitle = r.title || "";
    parsedSteps = r.steps || [];
    parsedSource = r.source_url || "";
    parsedNutrition = r.nutrition || null;
    parsedDirty = false;
  } catch (e) {
    err = "Couldn't read that recipe. Check the link, or paste the text instead.";
  } finally {
    parsing = false; render();
  }
}

// If the ingredient list was hand-edited, re-run the parser on the edited names
// so package/base amounts (used for shopping + stock) match what you typed.
async function reparseIfDirty() {
  if (!parsedDirty) return true;
  const usable = parsed.filter(p => (p.name || "").trim());
  if (!usable.length) { err = "Add at least one ingredient."; render(); return false; }
  const lines = usable.map(p => `${p.use_qty || ""} ${p.use_unit || ""} ${p.name}`.trim()).join("\n");
  parsing = true; err = ""; render();
  try {
    const r = await api("/parse", J({ m: "POST", b: { recipe: `TITLE: ${parsedTitle || "Recipe"}\n\nINGREDIENTS:\n${lines}` } }));
    if (r.error) throw new Error(r.error);
    if (!r.items || !r.items.length) throw new Error("Couldn't re-read the edited ingredients.");
    // keep each row's use flag by position where possible
    parsed = r.items.map((x, i) => ({ ...x, use: usable[i] ? usable[i].use !== false : true }));
    parsedDirty = false;
    return true;
  } catch (e) {
    err = e && e.message ? e.message : "Couldn't process the edits.";
    return false;
  } finally {
    parsing = false;
  }
}

async function addToListEdited(all) {
  if (!(await reparseIfDirty())) { render(); return; }
  await addToList(parsed.filter(p => p.use), all);
}
async function cookEdited() {
  if (!(await reparseIfDirty())) { render(); return; }
  await cook(parsed.filter(p => p.use));
}

// Downscale an image file and return { dataUrl, base64, mediaType }.
function readAndShrinkImage(file, maxDim = 1400) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale); height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      resolve({ dataUrl, base64: dataUrl.split(",")[1], mediaType: "image/jpeg" });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

async function addPhotoPage(file) {
  err = ""; render();
  try {
    const im = await readAndShrinkImage(file);
    photoImages.push(im);
    render();
  } catch (e) {
    err = "Couldn't load that image."; render();
  }
}

async function readPhotoPages() {
  if (!photoImages.length) return;
  err = ""; parsing = true; render();
  try {
    const images = photoImages.map(im => ({ data: im.base64, media_type: im.mediaType }));
    const r = await api("/parse", J({ m: "POST", b: { images } }));
    if (r.error) throw new Error(r.error);
    if (!r.items || !r.items.length) throw new Error("No ingredients found in those photos. Try clearer pictures, or type it in.");
    parsed = r.items.map(x => ({ ...x, use: true }));
    parsedTitle = r.title || "";
    parsedSteps = r.steps || [];
    parsedSource = "";
    parsedNutrition = r.nutrition || null;
    parsedDirty = false;
    photoImages = [];
    recipeMode = "import"; // show the editable parsed card
  } catch (e) {
    err = e && e.message ? e.message : "Couldn't read those photos. Try clearer pictures.";
  } finally {
    parsing = false; render();
  }
}

async function saveManualRecipe() {
  if (!manualName.trim()) { err = "Give the recipe a name."; render(); return; }
  if (!manualIngredients.trim()) { err = "Add at least one ingredient."; render(); return; }
  parsing = true; err = ""; render();
  try {
    // Run the ingredient list through the parser to get shopping/pantry data.
    const r = await api("/parse", J({ m: "POST", b: { recipe: `TITLE: ${manualName}\n\nINGREDIENTS:\n${manualIngredients}` } }));
    if (r.error) throw new Error(r.error);
    if (!r.items || r.items.length === 0) throw new Error("Couldn't read those ingredients. Check the formatting.");
    const steps = manualDirections.split("\n").map(s => s.trim()).filter(Boolean);
    await api("/recipes", J({ m: "POST", b: {
      title: manualName.trim(),
      source_url: "",
      ingredients: r.items,
      steps,
      nutrition: r.nutrition || null,
    }}));
    manualName = ""; manualIngredients = ""; manualDirections = "";
    await refresh();
    tab = "saved"; viewing = null; recipeMode = "import";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === "saved"));
    render();
  } catch (e) {
    err = e && e.message ? e.message : "Couldn't save the recipe.";
  } finally {
    parsing = false;
    if (err) render();
  }
}

async function saveRecipe() {
  if (!(await reparseIfDirty())) { render(); return; }
  await api("/recipes", J({ m: "POST", b: {
    title: parsedTitle || "Untitled recipe",
    source_url: parsedSource,
    ingredients: parsed.filter(p => p.use !== false).map(({ use, ...rest }) => rest),
    steps: parsedSteps,
    nutrition: parsedNutrition,
  }}));
  await refresh();
  tab = "saved"; viewing = null;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === "saved"));
  render();
}

async function addToList(items, ignoreStock = false) {
  try {
    if (!items || !items.length) { err = "No ingredients to add."; render(); return; }
    let added = 0, skipped = [];
    for (const p of items) {
      const useBase = Number(p.use_base) || 0;
      const pkgBase = Number(p.pkg_base) || 1;
      const have = pantry.find(x => norm(x.name) === norm(p.name));
      const needBase = ignoreStock ? useBase : useBase - (have ? have.base : 0);
      if (needBase <= 0) { skipped.push(p.name); continue; }
      const packages = Math.max(1, Math.ceil(needBase / pkgBase));
      const existing = list.find(x => norm(x.name) === norm(p.name));
      if (existing) await api(`/list/${existing.id}`, J({ m: "PATCH", b: { packages: existing.packages + packages } }));
      else await api("/list", J({ m: "POST", b: {
        name: p.name, packages, base_unit: p.base_unit || "count", pkg_label: p.pkg_label || "each", pkg_base: pkgBase
      }}));
      added++;
    }
    if (added === 0) {
      await refresh();
      err = skipped.length
        ? `Already stocked: ${skipped.join(", ")}. Use “Add all” to add them anyway.`
        : "Nothing selected to add.";
      render();
      return;
    }
    err = "";
    parsed = null; rawRecipe = ""; recipeUrl = ""; viewing = null; tab = "list";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === "list"));
    refresh();
  } catch (e) {
    err = "Couldn't add to the list: " + (e && e.message ? e.message : e);
    render();
  }
}

async function cook(items) {
  try {
    await api("/cook", J({ m: "POST", b: { items: items.map(p => ({ name: p.name, use_base: p.use_base })) } }));
    err = "";
    parsed = null; rawRecipe = ""; recipeUrl = "";
    refresh();
  } catch (e) {
    err = "Couldn't subtract stock: " + (e && e.message ? e.message : e);
    render();
  }
}

async function addPantry() {
  const name = $("#pname").value, amt = +$("#pamt").value || 0, unitKey = $("#punit").value;
  if (!name.trim()) return;
  const u = unitByKey(unitKey);
  const baseAmt = +(amt * u.factor).toFixed(2);   // convert to g / ml / count
  const existing = pantry.find(x => norm(x.name) === norm(name));
  if (existing) {
    await api(`/pantry/${existing.id}`, J({ m: "PATCH", b: { base: +(existing.base + baseAmt).toFixed(2) } }));
  } else {
    // package size = the amount just entered, so "≈1 pkg" reads sensibly; label from the unit
    const label = u.key === "count" ? "each" : `${amt} ${u.key}`;
    await api("/pantry", J({ m: "POST", b: {
      name, base: baseAmt, base_unit: u.base, pkg_label: label, pkg_base: baseAmt || 1
    }}));
  }
  refresh();
}

refresh();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
}
